                              <span style={{fontSize:10,color:"#4ade80"}}>✓ {c.completadas} ({pctComp}%)</span>
                              {c.canceladas>0&&<span style={{fontSize:10,color:"#fca5a5"}}>✗ {c.canceladas} ({pctCanc}%)</span>}
                              {c.enProceso>0&&<span style={{fontSize:10,color:"#fbbf24"}}>⏳ {c.enProceso}</span>}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>}
            </div>
          </div>
        </div>}

        {/* ── REASIGNAR VIAJE ── */}
        {section==='reasignar'&&<div>
          <div style={{background:"#ffffff",border:"1px solid #e5e7eb",borderRadius:16,overflow:"visible",boxShadow:"0 4px 20px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04)"}}>
            <div style={{borderBottom:"1px solid #e5e7eb",padding:"16px 22px",display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:40,height:40,borderRadius:10,background:"rgba(124,58,237,0.1)",border:"1px solid rgba(124,58,237,0.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>🔄</div>
              <div style={{flex:1}}><h2 style={{margin:0,fontSize:16,fontWeight:700,color:"#1e293b"}}>Reasignar Viaje</h2><p style={{margin:0,fontSize:11,color:"#64748b"}}>Cambiar placa o conductor de un viaje programado</p></div>
            </div>
            <div style={{padding:"20px 22px"}}><FReasignarViaje modulo={modulo} user={user}/></div>
          </div>
        </div>}
        
        {/* ── ETIQUETAS ── */}
        {section==='etiquetas'&&<div>
          <div style={{background:"#ffffff",border:"1px solid #e5e7eb",borderRadius:16,overflow:"visible",boxShadow:"0 4px 20px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04)"}}>
            <div style={{borderBottom:"1px solid #e5e7eb",padding:"16px 22px",display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:40,height:40,borderRadius:10,background:"rgba(124,58,237,0.1)",border:"1px solid rgba(124,58,237,0.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>🏷️</div>
              <div style={{flex:1}}><h2 style={{margin:0,fontSize:16,fontWeight:700,color:"#1e293b"}}>Etiquetas de Recolección</h2><p style={{margin:0,fontSize:11,color:"#64748b"}}>Generar etiquetas por placa y tienda</p></div>
            </div>
            <div style={{padding:"20px 22px"}}><FEtiquetas modulo={modulo}/></div>
          </div>
        </div>}
        
        {/* ── ORDEN DE RUTA ── */}
        {section==='orden_ruta'&&<div>
          <div style={{background:"#ffffff",border:"1px solid #e5e7eb",borderRadius:16,overflow:"visible",boxShadow:"0 4px 20px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04)"}}>
            <div style={{borderBottom:"1px solid #e5e7eb",padding:"16px 22px",display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:40,height:40,borderRadius:10,background:"rgba(59,130,246,0.1)",border:"1px solid rgba(59,130,246,0.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>🗺️</div>
              <div style={{flex:1}}><h2 style={{margin:0,fontSize:16,fontWeight:700,color:"#1e293b"}}>Orden de Ruta</h2><p style={{margin:0,fontSize:11,color:"#64748b"}}>Asignar prioridad de recolección por vehículo</p></div>
            </div>
            <div style={{padding:"20px 22px"}}><FOrdenRuta modulo={modulo}/></div>
          </div>
        </div>}

        {/* ── EXPORTAR ── */}
        {section==='exportar'&&<div>
          <div style={{background:"#ffffff",border:"1px solid #e5e7eb",borderRadius:16,boxShadow:"0 1px 3px rgba(0,0,0,0.04)",overflow:"hidden"}}>
            <div style={{borderBottom:"1px solid #e5e7eb",padding:"16px 22px",display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:40,height:40,borderRadius:10,background:"rgba(16,185,129,0.1)",border:"1px solid rgba(16,185,129,0.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>📥</div>
              <div><h2 style={{margin:0,fontSize:16,fontWeight:700,color:"#1e293b"}}>Exportar Solicitudes</h2><p style={{margin:0,fontSize:11,color:"#64748b"}}>Descarga directa en Excel con filtros</p></div>
            </div>
            <div style={{padding:"20px 22px"}}>
              <R2>
                <Fd label="Fecha Desde"><Ti type="date" value={expFechaDesde} onChange={function(v){setExpFechaDesde(v)}}/></Fd>
                <Fd label="Fecha Hasta"><Ti type="date" value={expFechaHasta} onChange={function(v){setExpFechaHasta(v)}}/></Fd>
              </R2>
              <R2>
                <Fd label="Filtrar por Estado"><Si value={expEstado} onChange={function(v){setExpEstado(v)}} options={["Solicitud recibida","Programado","Recolectado","Descargado","Cerrado – Facturable","Cerrado – No facturable","Cancelada"]} placeholder="Todos los estados"/></Fd>
                <Fd label="Buscar por ID"><Ti value={expIdFiltro} onChange={function(v){setExpIdFiltro(v)}} placeholder="Ej: DV26-003"/></Fd>
              </R2>
              <div style={{display:"flex",gap:8,marginBottom:16}}>
                <button type="button" onClick={function(){setExpFechaDesde('');setExpFechaHasta('');setExpEstado('');setExpIdFiltro('');}} style={{padding:"8px 16px",borderRadius:8,fontSize:12,border:"1px solid rgba(255,255,255,0.1)",background:"rgba(255,255,255,0.04)",color:"#94a3b8",cursor:"pointer",fontFamily:ft}}>Limpiar filtros</button>
                <span style={{fontSize:12,color:"#64748b",padding:"8px 0"}}>{!expFechaDesde&&!expFechaHasta&&!expEstado&&!expIdFiltro?"Se exportarán todas las solicitudes":"Con filtros aplicados"}</span>
              </div>
              <button onClick={handleExportar} disabled={expLoading} style={{width:"100%",padding:"13px",color:"#fff",border:"none",borderRadius:10,fontSize:15,fontWeight:700,cursor:expLoading?"not-allowed":"pointer",fontFamily:ft,background:expLoading?"#475569":"linear-gradient(135deg,#10b981,#059669)",boxShadow:"0 4px 14px rgba(16,185,129,0.25)"}}>
                {expLoading?"Generando archivo...":"📥 Descargar Excel"}
              </button>
            </div>
          </div>
        </div>}
        
        {/* ── REPORTES ── */}
        {section==='reportes'&&<div>
          <div style={{background:"#ffffff",border:"1px solid #e5e7eb",borderRadius:16,boxShadow:"0 1px 3px rgba(0,0,0,0.04)",overflow:"hidden"}}>
            <div style={{borderBottom:"1px solid #e5e7eb",padding:"16px 22px",display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:40,height:40,borderRadius:10,background:"rgba(245,158,11,0.1)",border:"1px solid rgba(245,158,11,0.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>📊</div>
              <div><h2 style={{margin:0,fontSize:16,fontWeight:700,color:"#1e293b"}}>Generar Reporte</h2><p style={{margin:0,fontSize:11,color:"#64748b"}}>Consolidado por rango de fechas</p></div>
            </div>
            <div style={{padding:"20px 22px"}}>
              <R2>
                <Fd label="Fecha Desde" req><Ti type="date" value={reportData.fecha_desde} onChange={function(v){setReportData(Object.assign({},reportData,{fecha_desde:v}))}}/></Fd>
                <Fd label="Fecha Hasta" req><Ti type="date" value={reportData.fecha_hasta} onChange={function(v){setReportData(Object.assign({},reportData,{fecha_hasta:v}))}}/></Fd>
              </R2>
              {reportResult&&<div style={{padding:"12px 16px",borderRadius:10,marginBottom:14,background:reportResult.ok?"rgba(22,163,74,0.1)":"rgba(239,68,68,0.1)",border:reportResult.ok?"1px solid rgba(22,163,74,0.2)":"1px solid rgba(239,68,68,0.2)",display:"flex",alignItems:"center",gap:10}}>
                <span style={{fontSize:17}}>{reportResult.ok?"✅":"❌"}</span>
                <span style={{fontSize:13,color:reportResult.ok?"#4ade80":"#fca5a5",fontWeight:500}}>{reportResult.msg}</span>
              </div>}
              <button onClick={handleReport} disabled={reportSending} style={{width:"100%",padding:"13px",color:"#fff",border:"none",borderRadius:10,fontSize:15,fontWeight:700,cursor:reportSending?"not-allowed":"pointer",fontFamily:ft,background:reportSending?"#475569":"linear-gradient(135deg,#f59e0b,#d97706)"}}>
                {reportSending?"Generando...":"📊 Generar y Enviar Reporte"}
              </button>
            </div>
          </div>
        </div>}

        {/* ── ADMIN ── */}
        {section==='admin'&&<div>
          <div style={{background:"#ffffff",border:"1px solid #e5e7eb",borderRadius:16,boxShadow:"0 1px 3px rgba(0,0,0,0.04)",overflow:"hidden"}}>
            <div style={{borderBottom:"1px solid #e5e7eb",padding:"16px 22px",display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:40,height:40,borderRadius:10,background:"rgba(168,85,247,0.1)",border:"1px solid rgba(168,85,247,0.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>⚙️</div>
              <div><h2 style={{margin:0,fontSize:16,fontWeight:700,color:"#1e293b"}}>Administrar Usuarios</h2><p style={{margin:0,fontSize:11,color:"#64748b"}}>Crear, editar y gestionar</p></div>
            </div>
            <div style={{padding:"20px 22px"}}>
              <div style={{background:"rgba(255,255,255,0.02)",borderRadius:12,padding:16,marginBottom:16,border:"1px solid rgba(255,255,255,0.06)"}}>
                <p style={{fontSize:13,fontWeight:700,color:"#1e293b",marginBottom:12}}>Crear nuevo usuario</p>
                <R2>
                  <Ti value={newUser.usuario||''} onChange={function(v){setNewUser(Object.assign({},newUser,{usuario:v}))}} placeholder="Usuario"/>
                  <input type="password" value={newUser.password||''} onChange={function(e){setNewUser(Object.assign({},newUser,{password:e.target.value}))}} placeholder="Contraseña" style={Object.assign({},bI,{padding:"10px 14px"})}/>
                </R2>
                <div style={{marginTop:10,marginBottom:10}}><Ti value={newUser.nombre||''} onChange={function(v){setNewUser(Object.assign({},newUser,{nombre:v}))}} placeholder="Nombre completo"/></div>
                <Fd label="Permisos">
                  <Ps options={["solicitudes","programacion","recoleccion","descargue","cierre","reportes","consulta","admin","vehiculos","cancelacion","novedades","solicitudes_textil","programacion_textil","recoleccion_textil","desc_bodega_textil","asignacion_textil","descargue_textil","etiquetas_textil","cierre_textil","reportes_textil","consulta_textil","cancelacion_textil","novedades_textil"]} selected={(newUser.permisos||'').split(',').filter(function(p){return p.trim()!=='';})} onChange={function(v){setNewUser(Object.assign({},newUser,{permisos:v.join(',')}))}} multi={true}/>
                </Fd>
                <button onClick={async function(){if(!newUser.usuario||!newUser.password||!newUser.nombre||!newUser.permisos)return;await adminAction('crear',newUser);setNewUser({});}} style={{padding:"10px 20px",background:"linear-gradient(135deg,#a855f7,#7c3aed)",color:"#fff",border:"none",borderRadius:10,fontSize:13,fontWeight:600,cursor:"pointer"}}>Crear Usuario</button>
              </div>
              <div style={{borderTop:"1px solid rgba(255,255,255,0.06)",paddingTop:16}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                  <p style={{fontSize:13,fontWeight:700,color:"#1e293b",margin:0}}>Usuarios existentes</p>
                  <button onClick={cargarListaUsuarios} disabled={adminLoading} style={{padding:"6px 14px",border:"1px solid rgba(255,255,255,0.08)",background:"rgba(255,255,255,0.04)",borderRadius:8,fontSize:11,color:"#94a3b8",fontFamily:mn,cursor:"pointer"}}>{adminLoading?"Cargando...":"🔄 Cargar"}</button>
                </div>
                {adminUsers.length===0&&<p style={{fontSize:12,color:"#64748b",textAlign:"center",padding:10}}>Presiona "Cargar" para ver</p>}
                {adminUsers.map(function(u){
                  var permsArr=(u.permisos||'').split(',').map(function(p){return p.trim();}).filter(function(p){return p!=='';});
                  var isEditing=editUser&&editUser.usuario===u.usuario;
                  var editPerms=isEditing?(editUser.permisos||'').split(',').map(function(p){return p.trim();}).filter(function(p){return p!=='';}):permsArr;
                  return(<div key={u.usuario} style={{background:isEditing?"rgba(59,130,246,0.06)":"rgba(255,255,255,0.02)",borderRadius:12,padding:14,marginBottom:10,border:isEditing?"1px solid rgba(59,130,246,0.2)":"1px solid rgba(255,255,255,0.06)"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                      <div><span style={{fontSize:14,fontWeight:600,color:"#f1f5f9"}}>{u.nombre}</span><span style={{fontSize:11,color:"#64748b",marginLeft:8,fontFamily:mn}}>@{u.usuario}</span></div>
                      <div style={{display:"flex",gap:6}}>
                        {!isEditing&&<button onClick={function(){setEditUser({usuario:u.usuario,permisos:u.permisos});}} style={{padding:"4px 10px",background:"rgba(59,130,246,0.1)",border:"1px solid rgba(59,130,246,0.2)",borderRadius:6,fontSize:11,color:"#60a5fa",cursor:"pointer",fontFamily:mn}}>Editar</button>}
                        {isEditing&&<button onClick={async function(){await adminAction('editar',{usuario:editUser.usuario,permisos:editUser.permisos});setEditUser(null);}} style={{padding:"4px 10px",background:"rgba(34,197,94,0.1)",border:"1px solid rgba(34,197,94,0.2)",borderRadius:6,fontSize:11,color:"#4ade80",cursor:"pointer",fontFamily:mn}}>Guardar</button>}
                        {isEditing&&<button onClick={function(){setEditUser(null);}} style={{padding:"4px 10px",background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:6,fontSize:11,color:"#94a3b8",cursor:"pointer",fontFamily:mn}}>Cancelar</button>}
                      </div>
                    </div>
                    {isEditing?<Ps options={["solicitudes","programacion","recoleccion","descargue","cierre","reportes","consulta","admin","vehiculos","cancelacion","novedades","solicitudes_textil","programacion_textil","recoleccion_textil","desc_bodega_textil","asignacion_textil","descargue_textil","etiquetas_textil","cierre_textil","reportes_textil","consulta_textil","cancelacion_textil","novedades_textil"]} selected={editPerms} onChange={function(v){setEditUser(Object.assign({},editUser,{permisos:v.join(',')}));}} multi={true}/>
                    :<div style={{display:"flex",flexWrap:"wrap",gap:5}}>{permsArr.map(function(p){return <span key={p} style={{padding:"3px 10px",borderRadius:10,fontSize:11,background:"rgba(59,130,246,0.1)",color:"#60a5fa",fontWeight:500}}>{p}</span>;})}</div>}
                  </div>);
                })}
              </div>
            </div>
          </div>
        </div>}
        
        <p style={{textAlign:"center",marginTop:16,fontSize:11,color:"#6b7280",fontFamily:mn}}>⚙️ SISTEMA DE DEVOLUCIONES CONDOR</p>
      </div>
    </div>
  );
}
ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
