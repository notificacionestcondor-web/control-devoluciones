@keyframes truckArrive{

  75%{transform:translateX(4px);opacity:1}

  0%{margin-top:0;height:50px}

  80%{margin-top:-2px;height:51px}

}
@keyframes truckSmoke1{
  0%{opacity:0;left:0;bottom:0}
  15%{opacity:0.6}
  100%{left:-30px;bottom:8px;width:24px;height:24px;opacity:0}
}
@keyframes truckSmoke2{
  0%{opacity:0;left:0;bottom:0}
  15%{opacity:0.5}
  100%{left:-50px;bottom:12px;width:20px;height:20px;opacity:0}
}

  0%{opacity:0;left:0;bottom:0}
  15%{opacity:0.4}
  100%{left:-35px;bottom:4px;width:28px;height:28px;opacity:0}
}

  100%{clip-path:circle(150% at 50% 50%);opacity:1}
}

@keyframes irisReveal{

.wave-group{position:relative;margin-bottom:24px}
.wave-group .wave-input{font-size:16px;padding:10px 10px 10px 5px;display:block;width:100%;border:none;border-bottom:1px solid #b0b0b0;background:transparent;color:#1e293b;font-family:'DM Sans',sans-serif;outline:none;box-sizing:border-box}
.wave-group .wave-input:focus{outline:none}
.wave-group .wave-label{color:#999;font-size:16px;font-weight:normal;position:absolute;pointer-events:none;left:5px;top:10px;display:flex}
.wave-group .wave-label-char{transition:0.2s ease all;transition-delay:calc(var(--index) * .05s)}
.wave-group .wave-input:focus ~ .wave-label .wave-label-char,
.wave-group .wave-input.has-value ~ .wave-label .wave-label-char{transform:translateY(-20px);font-size:12px;color:#2563eb}
.wave-group .wave-bar{position:relative;display:block;width:100%}
.wave-group .wave-bar:before,.wave-group .wave-bar:after{content:'';height:2px;width:0;bottom:1px;position:absolute;background:#2563eb;transition:0.2s ease all}
.wave-group .wave-bar:before{left:50%}
.wave-group .wave-bar:after{right:50%}
.wave-group .wave-input:focus ~ .wave-bar:before,
.wave-group .wave-input:focus ~ .wave-bar:after{width:50%}

// ─── Helper: convertir URL Drive a thumbnail embebible ───
const driveThumbUrl=function(url,size){
  if(!url) return '';
  var m=url.match(/\/file\/d\/([^/]+)/)||url.match(/[?&]id=([^&]+)/);
  if(!m) return url;
  return 'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w'+(size||400);
};

// ─── Helper: normalizar dirección colombiana para geocoding de Maps ───
const normalizarDireccion=function(dir){
  if(!dir) return '';
  var s=dir.toString().trim();
  // Abreviaturas comunes (case-insensitive, word boundary, punto opcional)
  var abrev=[
    [/\b(cll|cl)\b\.?/gi,'Calle'],
    [/\b(cra|cr|kra|kr)\b\.?/gi,'Carrera'],
    [/\b(av|avda|avd)\b\.?/gi,'Avenida'],
    [/\b(tv|trv|tvs)\b\.?/gi,'Transversal'],
    [/\b(diag|dg)\b\.?/gi,'Diagonal'],
    [/\b(mz|mza)\b\.?/gi,'Manzana'],
    [/\b(bl|blq|blo)\b\.?/gi,'Bloque']
  ];
  abrev.forEach(function(r){s=s.replace(r[0],r[1]);});
  // Compactar numeración: "#20 - 30" → "#20-30", "# 20" → "#20"
  s=s.replace(/#\s*(\d+)\s*-\s*(\d+)/g,'#$1-$2').replace(/#\s+/g,'#');
  // Limpiar comas/espacios duplicados
  s=s.replace(/\s+/g,' ').replace(/,\s*,/g,',').replace(/\s*,\s*/g,', ').trim();
  // Asegurar ", Colombia" al final
  if(!/colombia/i.test(s)) s+=', Colombia';
  return s;
};

// ─── Helper: abrir ruta en Google Maps (usa ubicación actual como origen) ───
const abrirRutaMaps=function(direcciones){
  var dirs=(direcciones||[])
    .filter(function(d){return d&&d.toString().trim();})
    .map(normalizarDireccion)
    .filter(function(d){return d;});
  if(dirs.length===0) return;
  if(dirs.length>10){console.warn('abrirRutaMaps: '+dirs.length+' direcciones, Maps limita a 10. Se toman las primeras 10.');dirs=dirs.slice(0,10);}
  var dest=encodeURIComponent(dirs[dirs.length-1]);
  var url='https://www.google.com/maps/dir/?api=1&destination='+dest+'&travelmode=driving';
  if(dirs.length>1){
    url+='&waypoints='+dirs.slice(0,-1).map(encodeURIComponent).join('|');
  }
  window.open(url,'_blank','noopener');
};

function WaveInput({value,onChange,label,type,onKeyDown}){
  var chars=label.split('');
  var inputRef=useRef(null);
  var[autofilled,setAutofilled]=useState(false);
  useEffect(function(){
    var check=function(){
      if(inputRef.current){
        try{if(inputRef.current.matches(':-webkit-autofill')){setAutofilled(true);return;}}catch(e){}
        if(inputRef.current.value&&inputRef.current.value!==value){onChange(inputRef.current.value);setAutofilled(true);}
      }
    };
    var t1=setTimeout(check,100);
    var t2=setTimeout(check,500);
    var t3=setTimeout(check,1500);
    return function(){clearTimeout(t1);clearTimeout(t2);clearTimeout(t3);};
  },[]);
  var hasVal=value||autofilled;
  return(
    <div className="wave-group">
      <input ref={inputRef} type={type||"text"} className={"wave-input"+(hasVal?" has-value":"")} value={value||""} onChange={function(e){onChange(e.target.value);if(e.target.value)setAutofilled(true);}} onKeyDown={onKeyDown}/>

function ResumenPlaca({placa,modulo}){
  if(!placa) return null;
  // Fase 2B-4c: sombrear globales con datos del módulo activo
  var dmActual=DATOS_MODULO[modulo]||DATOS_MODULO.textil;
  var IDS_PLACA=dmActual.placa||{};
  var IDS_INFO_RECOLECCION=dmActual.infoRec||{};
  var idsDisp=(dmActual.pend&&dmActual.pend.recoleccion)||[];
  var idsPlaca=idsDisp.filter(function(id){return IDS_PLACA[id]===placa;});
  if(idsPlaca.length===0) return null;
  var totales={cv:0,cg:0,cf:0,tl:0,mb:0,rollos:0};
  idsPlaca.forEach(function(id){
    var info=IDS_INFO_RECOLECCION[id]||{};
    totales.cv+=parseInt(info.cv)||0;
    totales.cg+=parseInt(info.cg)||0;
    totales.cf+=parseInt(info.cf)||0;
    totales.tl+=parseInt(info.tl)||0;
    totales.mb+=parseInt(info.mb)||0;
    totales.rollos+=parseInt(info.rollos)||0;
  });
  var total=totales.cv+totales.cg+totales.cf+totales.tl+totales.mb+totales.rollos;
  if(total===0) return null;
  var items=[
    {k:"Cont. vacíos",v:totales.cv,c:"#60a5fa"},
    {k:"Ganchos",v:totales.cg,c:"#a78bfa"},
    {k:"Confección",v:totales.cf,c:"#f97316"},
    {k:"Telas",v:totales.tl,c:"#2dd4bf"},
    {k:"Mobiliario",v:totales.mb,c:"#fbbf24"},
    {k:"Rollos",v:totales.rollos,c:"#f472b6"}
  ].filter(function(i){return i.v>0;});
  return(
    <div style={{background:"#f8f9fa",border:"1px solid #e5e7eb",borderRadius:10,padding:12,marginBottom:16}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
        <span style={{fontSize:11,fontWeight:600,color:"#374151"}}>🚛 Pendiente en {placa}</span>
        <span style={{fontSize:13,fontWeight:700,color:"#1e293b",fontFamily:mn}}>{total} unid.</span>
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        {items.map(function(i){return(
          <div key={i.k} style={{background:"#ffffff",border:"1px solid #e5e7eb",borderRadius:8,padding:"6px 10px",display:"flex",alignItems:"center",gap:6}}>
            <div style={{width:6,height:6,borderRadius:"50%",background:i.c,flexShrink:0}}/>
            <span style={{fontSize:10,color:"#374151"}}>{i.k}</span>
            <span style={{fontSize:12,fontWeight:700,color:i.c,fontFamily:mn}}>{i.v}</span>
          </div>
        );})}
      </div>
      <p style={{fontSize:10,color:"#6b7280",marginTop:6}}>Quedan {idsPlaca.length} recolección(es) pendiente(s) para este vehículo</p>
    </div>
  );
}

function F4({d,s,modulo}){

    var info=infoMap[idSol]||{};
    console.log('autoFillDesc ID:', idSol, 'info:', JSON.stringify(info));
    var nd=Object.assign({},d,{id_sol:idSol,cv:'',cg:'',cf:'',tl:'',mb:'',rollos:'',ciudad_or:'',prods_desc:[]});
    if(info){
      nd.ciudad_or=info.ciudad||'';
      if(info.tienda)nd.tienda_desc=info.tienda;

      if(info.cv&&info.cv!=='0')nd.cv=info.cv;
      if(info.cg&&info.cg!=='0')nd.cg=info.cg;
      if(info.cf&&info.cf!=='0')nd.cf=info.cf;
      if(info.tl&&info.tl!=='0')nd.tl=info.tl;
      if(info.mb&&info.mb!=='0')nd.mb=info.mb;
      if(info.rollos&&info.rollos!=='0')nd.rollos=info.rollos;
    }
    s(nd);
  };

  var sumarSeleccion=function(selIds){
    if(!selIds||selIds.length===0){
      var nd=Object.assign({},d,{ids_seleccionados:[],cv:'',cg:'',cf:'',tl:'',mb:'',rollos:'',ciudad_or:''});

    selIds.forEach(function(id){
      var info=infoMap[id]||{};
      if(!ciudad&&info.ciudad) ciudad=info.ciudad;
      if(info.cv&&info.cv!=='0') sums.cv+=parseInt(info.cv)||0;
      if(info.cg&&info.cg!=='0') sums.cg+=parseInt(info.cg)||0;
      if(info.cf&&info.cf!=='0') sums.cf+=parseInt(info.cf)||0;
      if(info.tl&&info.tl!=='0') sums.tl+=parseInt(info.tl)||0;
      if(info.mb&&info.mb!=='0') sums.mb+=parseInt(info.mb)||0;

      fetch(GOOGLE_SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify({formulario:'crear_vehiculo',placa:placa,linea:linea,capacidad:'',usuario:(user&&user.nombre)||''})});

  </div>);
}

/* ═════ CONFIRMAR VIAJE (En camino) ═════ */
function FConfirmarViaje({modulo,user}){
  var[tab,setTab]=useState('recoleccion'); // 'recoleccion' | 'cedi'
  var[viajeSel,setViajeSel]=useState(null);
  var[saving,setSaving]=useState(false);
  var[result,setResult]=useState(null);
  var[modalFalt,setModalFalt]=useState(null); // {viaje, ids_confirmados, ids_faltantes}

  // Fase 2B-5g: leer datos del módulo activo desde el mapa unificado.
  // FConfirmarViajeModal recibe `dataArr` como prop → queda sincronizado sin tocarlo.
  // Nota: IDS_INFO_ASIGNACION_CONFIRMAR se queda como variable global hasta Fase 3 (Opción Y).
  var dmActual=DATOS_MODULO[modulo]||DATOS_MODULO.textil;
  var dataArr=dmActual.controlData||[];

  // ── TAB 1: VIAJES DE RECOLECCIÓN (Recolectado → En camino) ──
  var viajesRec=useMemo(function(){
    var idsConf=((dmActual.pend&&dmActual.pend.recoleccionConfirmar)||[]);
    // Incluir también TODAS las guías pendientes de recolección del mismo viaje (para detectar faltantes)
    var idsRecPend=((dmActual.pend&&dmActual.pend.recoleccion)||[]);
    var mapa={};
    idsConf.forEach(function(id){
      for(var i=0;i<dataArr.length;i++){
        if(dataArr[i].id===id){
          var v=dataArr[i].viaje||'(sin viaje)';
          if(!mapa[v]) mapa[v]={viaje:v,placa:dataArr[i].placa_prog||'',conductor:dataArr[i].conductor||'',recolectadas:[],pendientes:[],esCrossDocking:false};
          if(dataArr[i].proceso==='Talleres') mapa[v].esCrossDocking=true;
          mapa[v].recolectadas.push(dataArr[i]);
          break;
        }
      }
    });
    // Agregar pendientes (no confirmadas) al mismo viaje
    idsRecPend.forEach(function(id){
      for(var i=0;i<dataArr.length;i++){
        if(dataArr[i].id===id){
          var v=dataArr[i].viaje||'(sin viaje)';
          if(!mapa[v]) mapa[v]={viaje:v,placa:dataArr[i].placa_prog||'',conductor:dataArr[i].conductor||'',recolectadas:[],pendientes:[],esCrossDocking:false};
          if(dataArr[i].proceso==='Talleres') mapa[v].esCrossDocking=true;
          mapa[v].pendientes.push(dataArr[i]);
          break;
        }
      }
    });
    // Solo mostrar viajes que tengan al menos una recolectada lista
    return Object.keys(mapa).filter(function(k){return mapa[k].recolectadas.length>0;}).map(function(k){return mapa[k];}).sort(function(a,b){return b.viaje>a.viaje?1:-1;});
  },[dataArr,modulo]);

  // ── TAB 2: VIAJES CEDI (Asignado → En camino CEDI) ──
  // Fase 1B-3-F: habilitado para los 4 módulos (antes solo Textil)
  var viajesCEDI=useMemo(function(){
    var mapa={};
    Object.keys(IDS_INFO_ASIGNACION_CONFIRMAR||{}).forEach(function(id){
      var inf=IDS_INFO_ASIGNACION_CONFIRMAR[id];
      var v=inf.viajeCEDI||'(sin viaje CEDI)';
      if(!mapa[v]) mapa[v]={viaje:v,placa:inf.placa||'',conductor:inf.conductor||'',asignadas:[]};
      var solInfo=null;for(var i=0;i<dataArr.length;i++){if(dataArr[i].id===id){solInfo=dataArr[i];break;}}
      mapa[v].asignadas.push(Object.assign({id:id},inf,solInfo||{}));
    });
    return Object.keys(mapa).map(function(k){return mapa[k];}).sort(function(a,b){return b.viaje>a.viaje?1:-1;});
  },[modulo,dataArr]);

  // ── CONFIRMAR ──
  var confirmar=async function(tipo,viaje,idsConfirmados,idsFaltantes,accionFaltantes){
    setSaving(true);setResult(null);
    try{
      var payload={
        formulario:'confirmar_viaje',
        modulo:modulo,
        tipo:tipo, // 'Normal' | 'Bodega' | 'CEDI'
        viaje:viaje.viaje,
        placa:viaje.placa,
        ids:idsConfirmados,
        ids_faltantes_cancelar:accionFaltantes&&accionFaltantes.cancelar?accionFaltantes.cancelar:[],
        ids_faltantes_reasignar:accionFaltantes&&accionFaltantes.reasignar?accionFaltantes.reasignar:[],
        motivo_cancelacion:accionFaltantes&&accionFaltantes.motivo?accionFaltantes.motivo:'',
        usuario:user.nombre
      };
      await fetch(GOOGLE_SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      setResult({ok:true,msg:'Viaje '+viaje.viaje+' marcado '+(tipo==='CEDI'?'En camino a CEDI':tipo==='Bodega'?'En camino a Bodega':'En camino')+' ('+idsConfirmados.length+' guía(s))'});
      setViajeSel(null);setModalFalt(null);
      setTimeout(function(){if(window._refreshCatalogos)window._refreshCatalogos();setResult(null);},3000);
    }catch(err){setResult({ok:false,msg:err.message});}
    setSaving(false);
  };

  var intentarConfirmarRec=function(v){
    if(v.pendientes.length>0){
      setModalFalt({tipo:v.esCrossDocking?'Bodega':'Normal',viaje:v,ids_confirmados:v.recolectadas.map(function(s){return s.id;}),ids_faltantes:v.pendientes.map(function(s){return s.id;})});
      return;
    }
    confirmar(v.esCrossDocking?'Bodega':'Normal',v,v.recolectadas.map(function(s){return s.id;}),[],null);
  };

  var confirmarCEDI=function(v){
    confirmar('CEDI',v,v.asignadas.map(function(s){return s.id;}),[],null);
  };

  // Filtro por placa (aplica a ambas pestañas)
  var[filtroPlaca,setFiltroPlaca]=useState('');
  var placasDisponibles=useMemo(function(){
    var set={};
    viajesRec.forEach(function(v){if(v.placa) set[v.placa]=true;});
    viajesCEDI.forEach(function(v){if(v.placa) set[v.placa]=true;});
    return Object.keys(set).sort();
  },[viajesRec,viajesCEDI]);
  var viajesRecFiltrados=filtroPlaca?viajesRec.filter(function(v){return v.placa===filtroPlaca;}):viajesRec;
  var viajesCEDIFiltrados=filtroPlaca?viajesCEDI.filter(function(v){return v.placa===filtroPlaca;}):viajesCEDI;

  return(<div>
    {/* FILTRO POR PLACA */}
    {placasDisponibles.length>0&&<div style={{display:"flex",gap:8,alignItems:"center",marginBottom:12}}>
      <div style={{flex:1}}><SS value={filtroPlaca} onChange={function(v){setFiltroPlaca(v)}} options={placasDisponibles} placeholder="🚛 Filtrar por placa..."/></div>
      {filtroPlaca&&<button type="button" onClick={function(){setFiltroPlaca('');}} style={{padding:"8px 14px",borderRadius:8,fontSize:12,border:"1px solid #d1d5db",background:"#ffffff",color:"#374151",cursor:"pointer",fontFamily:ft}}>Limpiar</button>}
    </div>}
    {/* TABS */}
    {/* Fase 1B-3-F: tabs visibles para los 4 módulos (antes solo Textil) */}
    <div style={{display:"flex",gap:8,marginBottom:16}}>
      <button type="button" onClick={function(){setTab('recoleccion');setViajeSel(null);}} style={{flex:1,padding:"10px",borderRadius:10,fontSize:13,fontFamily:ft,fontWeight:tab==='recoleccion'?700:400,border:tab==='recoleccion'?"1.5px solid #ea580c":"1px solid #d1d5db",background:tab==='recoleccion'?"rgba(234,88,12,0.08)":"#ffffff",color:tab==='recoleccion'?"#c2410c":"#374151",cursor:"pointer"}}>🚚 Recolección → En camino ({viajesRecFiltrados.length})</button>
      <button type="button" onClick={function(){setTab('cedi');setViajeSel(null);}} style={{flex:1,padding:"10px",borderRadius:10,fontSize:13,fontFamily:ft,fontWeight:tab==='cedi'?700:400,border:tab==='cedi'?"1.5px solid #06b6d4":"1px solid #d1d5db",background:tab==='cedi'?"rgba(6,182,212,0.08)":"#ffffff",color:tab==='cedi'?"#0891b2":"#374151",cursor:"pointer"}}>🏭 Asignación → En camino CEDI ({viajesCEDIFiltrados.length})</button>
    </div>

    {result&&<div style={{padding:"12px 16px",borderRadius:10,marginBottom:14,background:result.ok?"rgba(22,163,74,0.08)":"rgba(239,68,68,0.08)",border:result.ok?"1px solid rgba(22,163,74,0.2)":"1px solid rgba(239,68,68,0.2)",display:"flex",alignItems:"center",gap:10}}>
      <span style={{fontSize:17}}>{result.ok?"✅":"❌"}</span>
      <span style={{fontSize:13,color:result.ok?"#16a34a":"#dc2626",fontWeight:500}}>{result.msg}</span>
    </div>}

    {/* TAB 1: RECOLECCIÓN */}
    {tab==='recoleccion'&&<div>
      {viajesRecFiltrados.length===0&&<p style={{textAlign:"center",color:"#6b7280",fontSize:13,padding:20}}>{filtroPlaca?"No hay viajes con placa "+filtroPlaca:"No hay viajes pendientes por confirmar"}</p>}
      {viajesRecFiltrados.map(function(v){
        var totalGuias=v.recolectadas.length+v.pendientes.length;
        var pctListo=totalGuias>0?Math.round((v.recolectadas.length/totalGuias)*100):0;
        return(
          <div key={v.viaje} style={{background:"#ffffff",border:"1px solid #e5e7eb",borderRadius:12,padding:14,marginBottom:10,boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:14,fontWeight:700,color:"#7c3aed",fontFamily:mn}}>{v.viaje}</span>
                <span style={{fontSize:13,fontWeight:600,color:"#1e293b"}}>{v.placa}</span>
                <span style={{fontSize:11,color:"#6b7280"}}>{v.conductor}</span>
                {v.esCrossDocking&&<span style={{padding:"2px 8px",borderRadius:6,fontSize:10,background:"rgba(139,92,246,0.12)",color:"#7c3aed",fontWeight:600}}>CROSS-DOCKING</span>}
              </div>
              <span style={{padding:"3px 10px",borderRadius:8,fontSize:11,fontWeight:600,background:v.pendientes.length===0?"rgba(22,163,74,0.12)":"rgba(245,158,11,0.12)",color:v.pendientes.length===0?"#16a34a":"#d97706"}}>{v.recolectadas.length}/{totalGuias} ({pctListo}%)</span>
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:10}}>
              {v.recolectadas.map(function(s){return <span key={s.id} style={{padding:"3px 8px",borderRadius:6,fontSize:10,background:"rgba(22,163,74,0.08)",border:"1px solid rgba(22,163,74,0.2)",color:"#16a34a",fontFamily:mn,fontWeight:600}}>✓ {s.id}{s.pedido?' / '+s.pedido:''}</span>;})}
              {v.pendientes.map(function(s){return <span key={s.id} style={{padding:"3px 8px",borderRadius:6,fontSize:10,background:"rgba(245,158,11,0.08)",border:"1px solid rgba(245,158,11,0.3)",color:"#d97706",fontFamily:mn,fontWeight:600}}>⏳ {s.id}{s.pedido?' / '+s.pedido:''}</span>;})}
            </div>
            <button type="button" disabled={saving} onClick={function(){intentarConfirmarRec(v);}} style={{width:"100%",padding:"10px",color:"#fff",border:"none",borderRadius:10,fontSize:13,fontWeight:700,cursor:saving?"not-allowed":"pointer",fontFamily:ft,background:saving?"#94a3b8":v.pendientes.length===0?"linear-gradient(135deg,#16a34a,#15803d)":"linear-gradient(135deg,#f59e0b,#d97706)"}}>
              {v.pendientes.length===0?"🛣️ Confirmar En Camino ("+v.recolectadas.length+" guías)":"⚠️ Confirmar con "+v.pendientes.length+" pendiente(s)"}
            </button>
          </div>
        );
      })}
    </div>}

    {/* TAB 2: CEDI */}
    {/* Fase 1B-3-F: contenido del TAB 2 visible en los 4 módulos (antes solo Textil) */}
    {tab==='cedi'&&<div>
      {viajesCEDIFiltrados.length===0&&<p style={{textAlign:"center",color:"#6b7280",fontSize:13,padding:20}}>{filtroPlaca?"No hay viajes CEDI con placa "+filtroPlaca:"No hay viajes CEDI pendientes por confirmar"}</p>}
      {viajesCEDIFiltrados.map(function(v){return(
        <div key={v.viaje} style={{background:"#ffffff",border:"1px solid #e5e7eb",borderRadius:12,padding:14,marginBottom:10,boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:14,fontWeight:700,color:"#06b6d4",fontFamily:mn}}>{v.viaje}</span>
              <span style={{fontSize:13,fontWeight:600,color:"#1e293b"}}>{v.placa}</span>
              <span style={{fontSize:11,color:"#6b7280"}}>{v.conductor}</span>
            </div>
            <span style={{padding:"3px 10px",borderRadius:8,fontSize:11,fontWeight:600,background:"rgba(6,182,212,0.12)",color:"#0891b2"}}>{v.asignadas.length} guía(s)</span>
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:10}}>
            {v.asignadas.map(function(s){return <span key={s.id} style={{padding:"3px 8px",borderRadius:6,fontSize:10,background:"rgba(6,182,212,0.08)",border:"1px solid rgba(6,182,212,0.2)",color:"#0891b2",fontFamily:mn,fontWeight:600}}>{s.id}{s.pedido?' / '+s.pedido:''}</span>;})}
          </div>
          <button type="button" disabled={saving} onClick={function(){confirmarCEDI(v);}} style={{width:"100%",padding:"10px",color:"#fff",border:"none",borderRadius:10,fontSize:13,fontWeight:700,cursor:saving?"not-allowed":"pointer",fontFamily:ft,background:saving?"#94a3b8":"linear-gradient(135deg,#06b6d4,#0891b2)"}}>
            🛣️ Confirmar En Camino a CEDI
          </button>
        </div>
      );})}
    </div>}

    {/* MODAL FALTANTES se renderiza en 2E */}
    {modalFalt&&<FConfirmarViajeModal modal={modalFalt} onCancel={function(){setModalFalt(null);}} onConfirm={function(accionFaltantes){confirmar(modalFalt.tipo,modalFalt.viaje,modalFalt.ids_confirmados,modalFalt.ids_faltantes,accionFaltantes);}} modulo={modulo} dataArr={dataArr}/>}
  </div>);
}

/* ═════ MODAL FALTANTES (Confirmar Viaje) ═════ */
function FConfirmarViajeModal(props){
  var modal=props.modal,dataArr=props.dataArr,modulo=props.modulo;
  var idsFalt=modal.ids_faltantes||[];
  // Estado por ID: {accion:'cancelar'|'reasignar', viaje_destino?:string}
  var[acciones,setAcciones]=useState(function(){var o={};idsFalt.forEach(function(id){o[id]={accion:'cancelar'};});return o;});
  var[motivo,setMotivo]=useState('');
  var[errores,setErrores]=useState({});

  // Viajes destino disponibles para reasignar: viajes activos (no cerrado/cancelado) distintos del actual
  var viajesDestino=useMemo(function(){
    var mapa={};
    dataArr.forEach(function(c){
      if(!c.viaje||c.viaje===modal.viaje.viaje) return;
      if(c.estado==='Cancelada'||c.estado.indexOf('Cerrado')>=0) return;
      if(!mapa[c.viaje]) mapa[c.viaje]={viaje:c.viaje,placa:c.placa_prog||'',conductor:c.conductor||'',count:0};
      mapa[c.viaje].count++;
    });
    return Object.keys(mapa).map(function(k){return mapa[k];}).sort(function(a,b){return b.viaje>a.viaje?1:-1;});
  },[dataArr,modal.viaje.viaje]);

  var viajesDestinoOpts=viajesDestino.map(function(v){return{value:v.viaje,label:v.viaje+' — '+v.placa+' ('+v.count+' guía'+(v.count!==1?'s':'')+')'};});

  var cambiarAccion=function(id,accion){
    setAcciones(function(prev){var n=Object.assign({},prev);n[id]=Object.assign({},n[id],{accion:accion});return n;});
    setErrores(function(prev){var n=Object.assign({},prev);delete n[id];return n;});
  };
  var cambiarDestino=function(id,viaje){
    setAcciones(function(prev){var n=Object.assign({},prev);n[id]=Object.assign({},n[id],{viaje_destino:viaje});return n;});
    setErrores(function(prev){var n=Object.assign({},prev);delete n[id];return n;});
  };

  var confirmar=function(){
    var errs={};
    var cancelar=[],reasignar=[];
    idsFalt.forEach(function(id){
      var a=acciones[id]||{};
      if(a.accion==='cancelar'){cancelar.push(id);}
      else if(a.accion==='reasignar'){
        if(!a.viaje_destino){errs[id]='Selecciona viaje destino';}
        else reasignar.push({id:id,viaje_destino:a.viaje_destino});
      } else {errs[id]='Selecciona una acción';}
    });
    var hayCancelaciones=cancelar.length>0;
    if(hayCancelaciones&&!motivo.trim()) errs._motivo='Motivo de cancelación requerido';
    setErrores(errs);
    if(Object.keys(errs).length>0) return;
    props.onConfirm({cancelar:cancelar,reasignar:reasignar,motivo:motivo.trim()});
  };

  var conteoCanc=idsFalt.filter(function(id){return(acciones[id]||{}).accion==='cancelar';}).length;
  var conteoReas=idsFalt.filter(function(id){return(acciones[id]||{}).accion==='reasignar';}).length;

  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <div style={{background:"#fff",borderRadius:16,maxWidth:600,width:"100%",maxHeight:"90vh",display:"flex",flexDirection:"column",overflow:"hidden"}}>
      {/* HEADER */}
      <div style={{padding:"18px 20px",borderBottom:"1px solid #e5e7eb",background:"#fef2f2"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
          <span style={{fontSize:22}}>⚠️</span>
          <p style={{margin:0,fontSize:15,fontWeight:700,color:"#991b1b"}}>Guías pendientes en el viaje {modal.viaje.viaje}</p>
        </div>
        <p style={{margin:0,fontSize:12,color:"#7f1d1d"}}>Hay {idsFalt.length} guía(s) sin recolectar. Decide qué hacer con cada una antes de confirmar el viaje.</p>
      </div>

      {/* LISTA */}
      <div style={{padding:"14px 20px",overflowY:"auto",flex:1}}>
        {idsFalt.map(function(id){
          var info=null;for(var i=0;i<dataArr.length;i++){if(dataArr[i].id===id){info=dataArr[i];break;}}
          var a=acciones[id]||{};
          var err=errores[id];
          return(
            <div key={id} style={{background:"#f8f9fa",border:err?"1.5px solid #ef4444":"1px solid #e5e7eb",borderRadius:10,padding:12,marginBottom:10}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
                <div>
                  <span style={{fontSize:13,fontWeight:700,color:"#1e293b",fontFamily:mn}}>{id}</span>
                  {info&&info.pedido&&<span style={{marginLeft:8,fontSize:10,color:"#7c3aed",background:"rgba(124,58,237,0.08)",padding:"2px 6px",borderRadius:4,fontFamily:mn,fontWeight:600}}>Ped: {info.pedido}</span>}
                </div>
                {info&&info.tienda&&<span style={{fontSize:11,color:"#6b7280"}}>{info.tienda}</span>}
              </div>
              <div style={{display:"flex",gap:6,marginBottom:a.accion==='reasignar'?8:0}}>
                <button type="button" onClick={function(){cambiarAccion(id,'cancelar');}} style={{flex:1,padding:"8px",borderRadius:8,fontSize:11,fontFamily:ft,fontWeight:a.accion==='cancelar'?700:500,border:a.accion==='cancelar'?"1.5px solid #dc2626":"1px solid #d1d5db",background:a.accion==='cancelar'?"rgba(220,38,38,0.08)":"#fff",color:a.accion==='cancelar'?"#991b1b":"#374151",cursor:"pointer"}}>❌ Cancelar</button>
                <button type="button" onClick={function(){cambiarAccion(id,'reasignar');}} style={{flex:1,padding:"8px",borderRadius:8,fontSize:11,fontFamily:ft,fontWeight:a.accion==='reasignar'?700:500,border:a.accion==='reasignar'?"1.5px solid #f59e0b":"1px solid #d1d5db",background:a.accion==='reasignar'?"rgba(245,158,11,0.08)":"#fff",color:a.accion==='reasignar'?"#b45309":"#374151",cursor:"pointer"}}>🔄 Reasignar</button>
              </div>
              {a.accion==='reasignar'&&<div>
                {viajesDestinoOpts.length===0?<p style={{margin:0,fontSize:11,color:"#dc2626"}}>No hay otros viajes activos disponibles. Usa Cancelar.</p>
                :<SSBusq value={a.viaje_destino||''} onChange={function(v){cambiarDestino(id,v);}} opciones={viajesDestinoOpts} placeholder="Viaje destino..."/>}
              </div>}
              {err&&<p style={{fontSize:10,color:"#dc2626",marginTop:4}}>{err}</p>}
            </div>
          );
        })}
      </div>

      {/* MOTIVO CANCELACIÓN */}
      {conteoCanc>0&&<div style={{padding:"0 20px 14px"}}>
        <Fd label={"Motivo de cancelación ("+conteoCanc+" guía"+(conteoCanc!==1?'s':'')+")"} req>
          <div style={errores._motivo?{border:"1.5px solid #ef4444",borderRadius:10}:{}}>
            <Ta value={motivo} onChange={setMotivo} placeholder="Ej: tienda cerrada, mercancía no lista, cliente no disponible..."/>
          </div>
          {errores._motivo&&<p style={{fontSize:10,color:"#dc2626",marginTop:2}}>{errores._motivo}</p>}
        </Fd>
      </div>}

      {/* FOOTER */}
      <div style={{padding:"14px 20px",borderTop:"1px solid #e5e7eb",background:"#f8f9fa"}}>
        <div style={{display:"flex",gap:10,marginBottom:10,fontSize:11,flexWrap:"wrap"}}>
          <span style={{background:"rgba(22,163,74,0.1)",color:"#16a34a",padding:"3px 10px",borderRadius:8,fontWeight:600}}>✓ Confirmar: {modal.ids_confirmados.length}</span>
          {conteoCanc>0&&<span style={{background:"rgba(220,38,38,0.1)",color:"#dc2626",padding:"3px 10px",borderRadius:8,fontWeight:600}}>❌ Cancelar: {conteoCanc}</span>}
          {conteoReas>0&&<span style={{background:"rgba(245,158,11,0.1)",color:"#b45309",padding:"3px 10px",borderRadius:8,fontWeight:600}}>🔄 Reasignar: {conteoReas}</span>}
        </div>
        <div style={{display:"flex",gap:8}}>
          <button type="button" onClick={props.onCancel} style={{flex:1,padding:"10px",borderRadius:10,fontSize:13,fontFamily:ft,fontWeight:600,border:"1px solid #d1d5db",background:"#fff",color:"#374151",cursor:"pointer"}}>Cerrar</button>
          <button type="button" onClick={confirmar} style={{flex:2,padding:"10px",borderRadius:10,fontSize:13,fontFamily:ft,fontWeight:700,border:"none",color:"#fff",background:"linear-gradient(135deg,#f59e0b,#d97706)",cursor:"pointer",boxShadow:"0 4px 14px rgba(245,158,11,0.25)"}}>✓ Confirmar viaje y aplicar acciones</button>
        </div>
      </div>
    </div>

}

/* ═════ ORDEN DE RUTA ═════ */
function FOrdenRuta({modulo}){
  var[placa,setPlaca]=useState('');
  var[items,setItems]=useState([]);
  var[saving,setSaving]=useState(false);
  var[result,setResult]=useState(null);

  // Fase 2B-5e: sombrear globales con datos del módulo activo.
  // Las referencias internas a IDS_PLACA e IDS_PENDIENTES quedan resueltas
  // a estas versiones locales sin tener que tocar cada punto de uso.
  var dmActual=DATOS_MODULO[modulo]||DATOS_MODULO.textil;
  var IDS_PLACA=dmActual.placa||{};
  var IDS_PENDIENTES={recoleccion:(dmActual.pend&&dmActual.pend.recoleccion)||[]};

  var idsRec=IDS_PENDIENTES.recoleccion||[];
  var placasSet={};
  idsRec.forEach(function(id){var p=IDS_PLACA[id];if(p&&!placasSet[p])placasSet[p]=true;});
  var placasArr=Object.keys(placasSet).sort();

  var selPlaca=function(p){
    setPlaca(p);setResult(null);
    if(!p){setItems([]);return;}
    var ids=idsRec.filter(function(id){return IDS_PLACA[id]===p;});
    var newItems=ids.map(function(id){
      var dataArr=dmActual.controlData||[];
      var info=null;for(var i=0;i<dataArr.length;i++){if(dataArr[i].id===id){info=dataArr[i];break;}}
      var ordenExistente=ORDEN_RUTA_MAP[id]?ORDEN_RUTA_MAP[id].orden:0;
      return{id:id,orden:ordenExistente,tienda:info?info.tienda:'',ciudad:info?info.ciudad:'',direccion:info?info.direccion:'',cantidades:info?info.cantidades:'',pedido:info?info.pedido:''};
    });
    newItems.sort(function(a,b){return(a.orden||999)-(b.orden||999);});
    setItems(newItems);
  };

  var cambiarOrden=function(idx,val){
    var ni=items.slice();ni[idx]=Object.assign({},ni[idx],{orden:parseInt(val)||0});setItems(ni);
  };

  var autoNumerar=function(){
    var ni=items.map(function(it,idx){return Object.assign({},it,{orden:idx+1});});setItems(ni);
  };

  var ordenarPorNum=function(){
    var ni=items.slice();ni.sort(function(a,b){return(a.orden||999)-(b.orden||999);});setItems(ni);
  };

  var mover=function(idx,dir){
    if(idx+dir<0||idx+dir>=items.length) return;
    var ni=items.slice();var temp=ni[idx];ni[idx]=ni[idx+dir];ni[idx+dir]=temp;
    ni=ni.map(function(it,i){return Object.assign({},it,{orden:i+1});});
    setItems(ni);
  };

  var guardar=async function(){
    if(!placa||items.length===0) return;
    setSaving(true);setResult(null);
    try{
      var payload={formulario:'orden_ruta',placa:placa,items:items.map(function(it){return{id:it.id,orden:it.orden};})};
      await fetch(GOOGLE_SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      items.forEach(function(it){ORDEN_RUTA_MAP[it.id]={placa:placa,orden:it.orden};});
      setResult({ok:true,msg:'Orden guardado: '+items.length+' solicitudes'});
    }catch(err){setResult({ok:false,msg:err.message});}
    setSaving(false);
  };

  return(<div>
    <Fd label="Placa del vehículo" req hint="Selecciona para ver solicitudes programadas"><SS value={placa} onChange={selPlaca} options={placasArr} placeholder="Seleccionar placa..."/></Fd>

    {placa&&items.length===0&&<p style={{textAlign:"center",color:"#6b7280",fontSize:13,padding:16}}>No hay recolecciones pendientes para {placa}</p>}

    {items.length>0&&<div>
      <div style={{display:"flex",gap:8,marginBottom:12,alignItems:"center"}}>
        <button type="button" onClick={autoNumerar} style={{padding:"6px 14px",borderRadius:8,fontSize:11,border:"1px solid #d1d5db",background:"#ffffff",color:"#374151",cursor:"pointer",fontFamily:ft}}>🔢 Auto numerar</button>
        <button type="button" onClick={ordenarPorNum} style={{padding:"6px 14px",borderRadius:8,fontSize:11,border:"1px solid #d1d5db",background:"#ffffff",color:"#374151",cursor:"pointer",fontFamily:ft}}>↕️ Ordenar por #</button>
        <span style={{fontSize:12,color:"#6b7280",marginLeft:"auto"}}>{items.length} solicitud(es)</span>
      </div>

      <div style={{display:"flex",flexDirection:"column",gap:6}}>
        {items.map(function(it,idx){return(
          <div key={it.id} style={{background:"#ffffff",border:"1px solid #e5e7eb",borderRadius:10,padding:"10px 14px",display:"flex",alignItems:"center",gap:10}}>
            <div style={{display:"flex",flexDirection:"column",gap:2}}>
              <button type="button" onClick={function(){mover(idx,-1)}} disabled={idx===0} style={{background:"none",border:"none",cursor:idx===0?"default":"pointer",fontSize:12,color:idx===0?"#d1d5db":"#374151",padding:0,lineHeight:1}}>▲</button>
              <button type="button" onClick={function(){mover(idx,1)}} disabled={idx===items.length-1} style={{background:"none",border:"none",cursor:idx===items.length-1?"default":"pointer",fontSize:12,color:idx===items.length-1?"#d1d5db":"#374151",padding:0,lineHeight:1}}>▼</button>
            </div>
            <input type="number" value={it.orden||''} onChange={function(e){cambiarOrden(idx,e.target.value)}} style={{width:40,padding:"4px 6px",border:"1px solid #d1d5db",borderRadius:6,fontSize:14,fontWeight:700,textAlign:"center",fontFamily:mn,color:"#2563eb"}}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
                <span style={{fontSize:13,fontWeight:700,color:"#1e293b",fontFamily:mn}}>{it.id}</span>
                {it.pedido&&<span style={{fontSize:10,color:"#6b7280"}}>Ped: {it.pedido}</span>}
              </div>
              <div style={{fontSize:11,color:"#6b7280"}}>
                {it.tienda&&<span>{it.tienda}</span>}
                {it.ciudad&&<span style={{marginLeft:6}}>| {it.ciudad}</span>}
              </div>
              {it.direccion&&<div style={{fontSize:10,color:"#9ca3af",marginTop:1}}>{it.direccion}</div>}
              {it.cantidades&&<div style={{fontSize:10,color:"#2563eb",marginTop:2}}>{it.cantidades}</div>}
            </div>
          </div>
        );})}
      </div>

      {result&&<div style={{padding:"12px 16px",borderRadius:10,marginTop:14,background:result.ok?"rgba(22,163,74,0.08)":"rgba(239,68,68,0.08)",border:result.ok?"1px solid rgba(22,163,74,0.2)":"1px solid rgba(239,68,68,0.2)",display:"flex",alignItems:"center",gap:10}}>
        <span style={{fontSize:17}}>{result.ok?"✅":"❌"}</span>
        <span style={{fontSize:13,color:result.ok?"#16a34a":"#dc2626",fontWeight:500}}>{result.msg}</span>
      </div>}

      <button onClick={guardar} disabled={saving} style={{width:"100%",padding:"13px",color:"#fff",border:"none",borderRadius:10,fontSize:15,fontWeight:700,cursor:saving?"not-allowed":"pointer",fontFamily:ft,background:saving?"#475569":"linear-gradient(135deg,#3b82f6,#2563eb)",boxShadow:"0 4px 14px rgba(37,99,235,0.25)",marginTop:14}}>
        {saving?"Guardando...":"💾 Guardar Orden de Ruta"}
      </button>
    </div>}
  </div>);
}

/* ═════ ETIQUETAS ═════ */
function FEtiquetas({modulo}){
  var[placa,setPlaca]=useState('');
  var[generating,setGenerating]=useState(false);
  var[expandida,setExpandida]=useState('');

  // Fase 2B-5e: sombrear globales con datos del módulo activo.
  // Cubre las referencias a IDS_PLACA, IDS_PENDIENTES e IDS_INFO_RECOLECCION
  // que aparecen más abajo en el componente.
  var dmActual=DATOS_MODULO[modulo]||DATOS_MODULO.textil;
  var IDS_PLACA=dmActual.placa||{};
  var IDS_INFO_RECOLECCION=dmActual.infoRec||{};
  var IDS_PENDIENTES={recoleccion:(dmActual.pend&&dmActual.pend.recoleccion)||[]};

  var idsRec=IDS_PENDIENTES.recoleccion||[];
  var placasSet={};
  idsRec.forEach(function(id){var p=IDS_PLACA[id];if(p&&!placasSet[p])placasSet[p]=true;});
  var placasArr=Object.keys(placasSet).sort();

  var idsPorPlaca=placa?idsRec.filter(function(id){return IDS_PLACA[id]===placa;}):[];

  // Agrupar por tienda
  var dataArr=dmActual.controlData||[];
  var tiendasMap={};
  idsPorPlaca.forEach(function(id){
    var info=null;for(var i=0;i<dataArr.length;i++){if(dataArr[i].id===id){info=dataArr[i];break;}}
    if(!info) return;
    var tienda=info.tienda||'Sin tienda';
    if(!tiendasMap[tienda]) tiendasMap[tienda]={tienda:tienda,ciudad:info.ciudad||'',solicitudes:[]};
    var infoRec=IDS_INFO_RECOLECCION[id]||{};
    tiendasMap[tienda].solicitudes.push({
      id:id,pedido:info.pedido||'',direccion:info.direccion||'',
      rollos:parseInt(infoRec.rollos)||parseInt(info.cantidades&&info.cantidades.match(/Rollos:\s*(\d+)/)?info.cantidades.match(/Rollos:\s*(\d+)/)[1]:0)||0,
      peso:parseFloat(info.peso)||0
    });
  });
  var tiendasArr=Object.keys(tiendasMap).map(function(k){return tiendasMap[k];}).sort(function(a,b){return b.solicitudes.length-a.solicitudes.length;});

  // Conductor
  var conductor='';
  if(idsPorPlaca.length>0){
    for(var i=0;i<dataArr.length;i++){if(dataArr[i].id===idsPorPlaca[0]&&dataArr[i].conductor){conductor=dataArr[i].conductor;break;}}
  }

  var generarEtiquetas=function(tiendaData){
    var w=window.open('','_blank','width=450,height=600');

    var hoy=new Date();

    var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Etiquetas - '+placa+'</title><style>';

    html+='body{font-family:Arial,sans-serif;background:#fff}';
    html+='.label{width:100mm;height:100mm;border:2px solid #000;padding:8px 10px;margin:10px auto;page-break-inside:avoid;position:relative;overflow:hidden}';
    html+='.header{text-align:center;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px}';
    html+='.header h1{font-size:14px;font-weight:bold;margin-bottom:2px}';

    html+='.row{display:flex;border-bottom:1px solid #ccc;padding:4px 0;font-size:11px}';
    html+='.row-label{font-weight:bold;min-width:80px;color:#000}';

    html+='.pedidos{background:#f5f5f5;border:1px solid #ddd;border-radius:4px;padding:6px 8px;margin:6px 0;font-size:10px}';
    html+='.pedidos-title{font-weight:bold;font-size:10px;margin-bottom:3px}';
    html+='.footer{text-align:right;font-size:8px;color:#666;margin-top:8px;padding-top:4px;border-top:1px solid #ccc}';
    html+='.big-num{font-size:28px;font-weight:bold;text-align:center;margin:6px 0}';
    html+='.zona{font-size:18px;font-weight:bold;text-align:center;border-top:2px solid #000;padding-top:6px;margin-top:6px}';
    html+='@media print{@page{size:100mm 100mm;margin:0}body{margin:0}.label{border:2px solid #000;margin:0;page-break-after:always;height:100mm;width:100mm}.label:last-child{page-break-after:avoid}}';
    html+='</style></head><body>';

    etiquetas.forEach(function(t){
      var totalRollos=t.solicitudes.reduce(function(s,sol){return s+sol.rollos;},0);
      var totalPeso=t.solicitudes.reduce(function(s,sol){return s+sol.peso;},0);
      var pedidos=t.solicitudes.map(function(sol){return sol.pedido;}).filter(function(p){return p;});

                  <div key={sol.id} style={{background:"#f8f9fa",border:"1px solid #e5e7eb",borderRadius:8,padding:"8px 12px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                    <div style={{flex:1}}>
                      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
                        <span style={{fontWeight:700,color:"#1e293b",fontFamily:mn,fontSize:13}}>{sol.id}</span>
                        {sol.pedido&&<span style={{fontSize:10,color:"#6b7280",background:"#e5e7eb",padding:"1px 6px",borderRadius:4}}>Ped: {sol.pedido}</span>}
                      </div>
                      <div style={{fontSize:10,color:"#6b7280"}}>
                        {sol.direccion&&<span>{sol.direccion}</span>}
                        {sol.rollos>0&&<span style={{marginLeft:6,color:"#2563eb",fontWeight:600}}>{sol.rollos} rollos</span>}
                        {sol.peso>0&&<span style={{marginLeft:6,color:"#374151"}}>{sol.peso.toFixed(1)} kg</span>}
                      </div>
                    </div>
                    <button type="button" onClick={function(){generarEtiquetaIndividual(sol);}} style={{padding:"4px 10px",borderRadius:6,fontSize:10,fontWeight:600,border:"1px solid rgba(37,99,235,0.2)",background:"rgba(37,99,235,0.06)",color:"#2563eb",cursor:"pointer",fontFamily:ft,flexShrink:0}}>🏷️</button>
                  </div>
                );})}
              </div>}
            </div>
          );
        })}
      </div>
    </div>}
  </div>);
}

/* Selector con búsqueda en label completo */
function SSBusq({value,onChange,opciones,placeholder}){
  var[open,setOpen]=useState(false);
  var[search,setSearch]=useState("");
  var ref=useRef(null);
  var flt=useMemo(function(){if(!search)return opciones;var q=search.toLowerCase();return opciones.filter(function(o){return o.label.toLowerCase().includes(q)||o.value.toLowerCase().includes(q);});},[search,opciones]);
  useEffect(function(){var h=function(e){if(ref.current&&!ref.current.contains(e.target))setOpen(false);};document.addEventListener("mousedown",h);return function(){document.removeEventListener("mousedown",h);};},[]);
  var selLabel='';
  if(value){for(var i=0;i<opciones.length;i++){if(opciones[i].value===value){selLabel=opciones[i].label;break;}}}
  return(
    <div ref={ref} style={{position:"relative"}}>
      <div onClick={function(){setOpen(!open)}} style={Object.assign({},bI,{cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between",minHeight:42},open?fI:{})}>
        <span style={{color:value?"#1e293b":"#9ca3af",fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>{selLabel||placeholder||"Seleccionar..."}</span>
        <span style={{fontSize:10,color:"#9ca3af",marginLeft:8,flexShrink:0}}>{open?"▲":"▼"}</span>
      </div>
      {open&&(<div style={{position:"absolute",top:"100%",left:0,right:0,zIndex:50,background:"#f1f3f5",border:"1px solid #d1d5db",borderRadius:10,marginTop:4,boxShadow:"0 12px 40px rgba(0,0,0,0.12)",maxHeight:280,display:"flex",flexDirection:"column"}}>
        <div style={{padding:"8px 10px",borderBottom:"1px solid #e5e7eb"}}>
          <input type="text" value={search} onChange={function(e){setSearch(e.target.value)}} placeholder="🔍 ID, pedido, tienda..." autoFocus style={Object.assign({},bI,{padding:"8px 12px",fontSize:13})}/>
        </div>
        <div style={{overflowY:"auto",flex:1}}>
          {flt.length===0?<div style={{padding:16,textAlign:"center",color:"#6b7280",fontSize:13}}>Sin resultados</div>
          :flt.slice(0,50).map(function(o){return(
            <div key={o.value} onClick={function(){onChange(o.value);setOpen(false);setSearch("");}} style={{padding:"9px 14px",cursor:"pointer",fontSize:12,fontFamily:ft,color:o.value===value?"#1e40af":"#1e293b",fontWeight:o.value===value?600:400,background:o.value===value?"rgba(37,99,235,0.08)":"transparent",borderBottom:"1px solid #e5e7eb"}} onMouseEnter={function(e){e.currentTarget.style.background="rgba(0,0,0,0.04)"}} onMouseLeave={function(e){e.currentTarget.style.background=o.value===value?"rgba(37,99,235,0.08)":"transparent"}}>{o.label}</div>
          );})}
          {flt.length>50&&<div style={{padding:"8px 14px",fontSize:11,color:"#6b7280",textAlign:"center"}}>Mostrando 50 de {flt.length}</div>}
        </div>
      </div>)}
    </div>
  );
}
  
/* ═════ REASIGNAR VIAJE ═════ */
function FReasignarViaje({modulo,user}){
  var[modo,setModo]=useState('reasignar');
  var[filtro,setFiltro]=useState('');
  var[filtroTipo,setFiltroTipo]=useState('placa');
  var[selViaje,setSelViaje]=useState(null);
  var[nuevaPlaca,setNuevaPlaca]=useState('');
  var[nuevoConductor,setNuevoConductor]=useState('');
  var[saving,setSaving]=useState(false);
  var[result,setResult]=useState(null);
  var[idAgregar,setIdAgregar]=useState('');
  // Estados para agregar placa nueva inline (mismo patrón que F2)
  var[crearPlacaOpen,setCrearPlacaOpen]=useState(false);
  var[crearPlacaVal,setCrearPlacaVal]=useState('');
  var[crearPlacaLinea,setCrearPlacaLinea]=useState('');
  var[crearPlacaMsg,setCrearPlacaMsg]=useState(null);

  // Fase 2B-5f: leer datos del módulo activo desde el mapa unificado.
  // Las 6+ referencias internas a `dataArr` más abajo quedan automáticamente
  // apuntando al módulo correcto.
  var dmActual=DATOS_MODULO[modulo]||DATOS_MODULO.textil;
  var dataArr=dmActual.controlData||[];

  // Agrupar por viaje
  var viajesMap={};
  dataArr.forEach(function(c){
    if(!c.viaje) return;
    if(c.estado==='Cancelada'||c.estado.indexOf('Cerrado')>=0) return;
    if(!viajesMap[c.viaje]) viajesMap[c.viaje]={viaje:c.viaje,placa:c.placa_prog||'',conductor:c.conductor||'',solicitudes:[]};
    viajesMap[c.viaje].solicitudes.push(c);
  });
  var viajesArr=Object.keys(viajesMap).map(function(k){return viajesMap[k];}).sort(function(a,b){return b.viaje>a.viaje?1:-1;});

  // Filtrar
  var filtrados=viajesArr;
  if(filtro){
    var q=filtro.toUpperCase();
    filtrados=viajesArr.filter(function(v){
      if(filtroTipo==='placa') return v.placa.toUpperCase().includes(q);
      if(filtroTipo==='viaje') return v.viaje.toUpperCase().includes(q);
      return v.placa.toUpperCase().includes(q)||v.viaje.toUpperCase().includes(q);
    });
  }

  var guardar=async function(){
    if(!selViaje||(!nuevaPlaca&&!nuevoConductor)){setResult({ok:false,msg:'Ingresa nueva placa o conductor'});return;}
    setSaving(true);setResult(null);
    try{
      var payload={formulario:'reasignar_viaje',viaje:selViaje.viaje,ids:selViaje.solicitudes.map(function(s){return s.id;}),nueva_placa:nuevaPlaca,nuevo_conductor:nuevoConductor,usuario:user.nombre};
      await fetch(GOOGLE_SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      setResult({ok:true,msg:'Viaje '+selViaje.viaje+' reasignado a '+(nuevaPlaca||selViaje.placa)});
      setSelViaje(null);setNuevaPlaca('');setNuevoConductor('');
      setTimeout(function(){if(window._refreshCatalogos)window._refreshCatalogos();setResult(null);},3000);
    }catch(err){setResult({ok:false,msg:err.message});}
    setSaving(false);
  };

  var agregarGuia=async function(){
    if(!selViaje||!idAgregar){setResult({ok:false,msg:'Selecciona viaje y guía'});return;}
    setSaving(true);setResult(null);
    try{
      var payload={formulario:'agregar_guia_viaje',viaje:selViaje.viaje,id_sol:idAgregar,placa:selViaje.placa,conductor:selViaje.conductor,usuario:user.nombre};
      await fetch(GOOGLE_SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      setResult({ok:true,msg:'Guía '+idAgregar+' agregada al viaje '+selViaje.viaje});
      setSelViaje(null);setIdAgregar('');
      setTimeout(function(){if(window._refreshCatalogos)window._refreshCatalogos();setResult(null);},3000);
    }catch(err){setResult({ok:false,msg:err.message});}
    setSaving(false);
  };

  var moverGuia=async function(){
    if(!selViaje||!idAgregar){setResult({ok:false,msg:'Selecciona viaje y guía'});return;}
    var infoMov=null;for(var mi=0;mi<dataArr.length;mi++){if(dataArr[mi].id===idAgregar){infoMov=dataArr[mi];break;}}
    if(infoMov&&infoMov.viaje===selViaje.viaje){setResult({ok:false,msg:'La guía ya pertenece a este viaje'});return;}
    setSaving(true);setResult(null);
    try{
      var payload={formulario:'mover_guia_viaje',id_sol:idAgregar,viaje_destino:selViaje.viaje,placa_destino:selViaje.placa,conductor_destino:selViaje.conductor,viaje_origen:infoMov?infoMov.viaje:'',usuario:user.nombre};
      await fetch(GOOGLE_SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      setResult({ok:true,msg:'Guía '+idAgregar+' movida al viaje '+selViaje.viaje});
      setSelViaje(null);setIdAgregar('');
      setTimeout(function(){if(window._refreshCatalogos)window._refreshCatalogos();setResult(null);},3000);
    }catch(err){setResult({ok:false,msg:err.message});}
    setSaving(false);
  };

  // Crear placa nueva inline (mismo patrón que F2)
  var crearPlacaInline=function(){
    var placa=(crearPlacaVal||'').trim().toUpperCase();
    var linea=(crearPlacaLinea||'').trim();
    if(!placa||!linea){setCrearPlacaMsg({tipo:'error',texto:'Placa y línea son obligatorias'});return;}
    var dup=VEHICULOS_DICT.find(function(v){return v.placa===placa&&v.activo});
    if(dup){setCrearPlacaMsg({tipo:'error',texto:'La placa '+placa+' ya existe'});return;}
    // Optimista: actualizar dict local, seleccionar placa y cerrar modal
    VEHICULOS_DICT=VEHICULOS_DICT.concat([{placa:placa,linea:linea,capacidad:null,activo:true}]);
    setNuevaPlaca(placa);
    setCrearPlacaOpen(false);setCrearPlacaVal('');setCrearPlacaLinea('');setCrearPlacaMsg(null);
    // POST en background
    try{
      fetch(GOOGLE_SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify({formulario:'crear_vehiculo',placa:placa,linea:linea,capacidad:'',usuario:(user&&user.nombre)||''})});
    }catch(e){}
    // Reconciliación silenciosa (3.3.2b-v3/1B-2-fix2: pasar módulo + cache local separado por módulo)
    setTimeout(function(){
      fetch(CATALOGO_URL+'?modulo='+modulo+'&_='+Date.now()).then(function(r){return r.json()}).then(function(cd){
        try{localStorage.setItem('condor_catalogos_'+modulo,JSON.stringify(cd));}catch(e){}
        if(cd.vehiculosDict) VEHICULOS_DICT=cd.vehiculosDict;
        var existe=(cd.vehiculosDict||[]).find(function(v){return v.placa===placa&&v.activo});
        if(!existe) alert('⚠️ La placa '+placa+' no se registró en el servidor. Revisa antes de reasignar.');
      }).catch(function(){});
    },2000);
  };

  return(<div>
    <Fd label="Modo">
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        <button type="button" onClick={function(){setModo('reasignar');setSelViaje(null);setIdAgregar('');setResult(null);}} style={{flex:"1 1 30%",padding:"10px",borderRadius:10,fontSize:12,fontFamily:ft,fontWeight:modo==='reasignar'?700:400,border:modo==='reasignar'?"1.5px solid #2563eb":"1px solid #d1d5db",background:modo==='reasignar'?"rgba(37,99,235,0.08)":"#ffffff",color:modo==='reasignar'?"#1e40af":"#374151",cursor:"pointer"}}>🔄 Reasignar viaje</button>
        <button type="button" onClick={function(){setModo('agregar');setSelViaje(null);setNuevaPlaca('');setNuevoConductor('');setResult(null);}} style={{flex:"1 1 30%",padding:"10px",borderRadius:10,fontSize:12,fontFamily:ft,fontWeight:modo==='agregar'?700:400,border:modo==='agregar'?"1.5px solid #16a34a":"1px solid #d1d5db",background:modo==='agregar'?"rgba(22,163,74,0.08)":"#ffffff",color:modo==='agregar'?"#15803d":"#374151",cursor:"pointer"}}>➕ Agregar guía</button>
        <button type="button" onClick={function(){setModo('mover');setSelViaje(null);setIdAgregar('');setResult(null);}} style={{flex:"1 1 30%",padding:"10px",borderRadius:10,fontSize:12,fontFamily:ft,fontWeight:modo==='mover'?700:400,border:modo==='mover'?"1.5px solid #f59e0b":"1px solid #d1d5db",background:modo==='mover'?"rgba(245,158,11,0.08)":"#ffffff",color:modo==='mover'?"#b45309":"#374151",cursor:"pointer"}}>↔️ Mover guía</button>
      </div>
    </Fd>

    <div style={{display:"flex",gap:8,marginBottom:12}}>
      <button type="button" onClick={function(){setFiltroTipo('placa');setFiltro('');}} style={{padding:"8px 14px",borderRadius:8,fontSize:12,fontFamily:ft,fontWeight:filtroTipo==='placa'?700:400,border:filtroTipo==='placa'?"1.5px solid #2563eb":"1px solid #d1d5db",background:filtroTipo==='placa'?"rgba(37,99,235,0.08)":"#ffffff",color:filtroTipo==='placa'?"#1e40af":"#374151",cursor:"pointer"}}>🚛 Por Placa</button>
      <button type="button" onClick={function(){setFiltroTipo('viaje');setFiltro('');}} style={{padding:"8px 14px",borderRadius:8,fontSize:12,fontFamily:ft,fontWeight:filtroTipo==='viaje'?700:400,border:filtroTipo==='viaje'?"1.5px solid #7c3aed":"1px solid #d1d5db",background:filtroTipo==='viaje'?"rgba(124,58,237,0.08)":"#ffffff",color:filtroTipo==='viaje'?"#6d28d9":"#374151",cursor:"pointer"}}>📋 Por Nº Viaje</button>
    </div>

    {(modo==='agregar'||modo==='mover')&&(function(){
      // Construir lista de guías con info para búsqueda por pedido
      var idsCandidatos=[];
      if(modo==='agregar'){
        // Guías sin programar — Fase 2B-5f: leer del módulo activo
        idsCandidatos=(dmActual.pend&&dmActual.pend.programacion)||[];
      } else {
        // Guías ya programadas (que están en algún viaje no cerrado)
        idsCandidatos=[];
        dataArr.forEach(function(c){
          if(c.viaje&&c.estado!=='Cancelada'&&c.estado.indexOf('Cerrado')<0&&c.estado!=='Descargado') idsCandidatos.push(c.id);
        });
      }
      // Opciones con info combinada
      var opciones=idsCandidatos.map(function(id){
        var info=null;for(var i=0;i<dataArr.length;i++){if(dataArr[i].id===id){info=dataArr[i];break;}}
        var label=id;
        if(info){
          if(info.pedido) label+=' / '+info.pedido;
          if(info.tienda) label+=' — '+info.tienda;
          if(modo==='mover'&&info.viaje) label+=' ['+info.viaje+']';
        }
        return{value:id,label:label};
      });
      return(
        <Fd label={modo==='agregar'?"Guía a agregar":"Guía a mover"} req hint="Busca por ID, Nº pedido o tienda">
          <SSBusq value={idAgregar} onChange={function(v){setIdAgregar(v);}} opciones={opciones} placeholder={modo==='agregar'?"Buscar guía sin programar...":"Buscar guía programada..."}/>
        </Fd>
      );
    })()}
    <Fd label={filtroTipo==='placa'?"Buscar por placa":"Buscar por Nº Viaje"}><Ti value={filtro} onChange={function(v){setFiltro(v.toUpperCase())}} placeholder={filtroTipo==='placa'?"Ej: NOL 505":"Ej: VJ26-0001"}/></Fd>

    {filtrados.length===0&&filtro&&<p style={{textAlign:"center",color:"#6b7280",fontSize:13,padding:16}}>No se encontraron viajes</p>}

    <div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:400,overflowY:"auto"}}>
      {filtrados.map(function(v){
        var isSel=selViaje&&selViaje.viaje===v.viaje;
        var ciudades={};v.solicitudes.forEach(function(s){if(s.ciudad)ciudades[s.ciudad]=true;});
        return(
          <div key={v.viaje} style={{background:isSel?"#eff6ff":"#ffffff",border:isSel?"1.5px solid #2563eb":"1px solid #e5e7eb",borderRadius:12,padding:14,cursor:"pointer",transition:"all 0.15s"}} onClick={function(){setSelViaje(isSel?null:v);setNuevaPlaca('');setNuevoConductor('');setResult(null);}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:14,fontWeight:700,color:"#7c3aed",fontFamily:mn}}>{v.viaje}</span>
                <span style={{fontSize:12,fontWeight:600,color:"#1e293b"}}>{v.placa}</span>
                <span style={{fontSize:11,color:"#6b7280"}}>{v.conductor}</span>
              </div>
              <span style={{padding:"3px 10px",borderRadius:8,fontSize:11,fontWeight:600,background:"rgba(59,130,246,0.1)",color:"#2563eb"}}>{v.solicitudes.length} guía{v.solicitudes.length!==1?'s':''}</span>
            </div>
            {Object.keys(ciudades).length>0&&<div style={{fontSize:10,color:"#6b7280",marginBottom:6}}>🏙️ {Object.keys(ciudades).join(', ')}</div>}
            <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
              {v.solicitudes.map(function(s){return(
                <span key={s.id} style={{padding:"2px 8px",borderRadius:6,fontSize:10,background:"#f1f3f5",border:"1px solid #e5e7eb",color:"#374151",fontFamily:mn}}>{s.id}{s.pedido?' / '+s.pedido:''}</span>
              );})}
            </div>

            {isSel&&modo==='reasignar'&&<div style={{marginTop:12,borderTop:"1px solid #e5e7eb",paddingTop:12}} onClick={function(e){e.stopPropagation();}}>
              <p style={{fontSize:12,fontWeight:700,color:"#1e293b",marginBottom:10}}>🔄 Reasignar viaje {v.viaje}</p>
              <div style={{background:"#fef9c3",border:"1px solid #fde68a",borderRadius:8,padding:8,marginBottom:10,fontSize:11,color:"#92400e"}}>
                ⚠️ Esto cambiará la placa y/o conductor para las {v.solicitudes.length} solicitudes de este viaje
              </div>
              <R2>
                <Fd label="Nueva placa" hint={"Actual: "+v.placa}>
                  {(function(){
                    var placasActivas=VEHICULOS_DICT.filter(function(veh){return veh.activo;}).map(function(veh){return veh.placa;});
                    var OPT_CREAR='➕ Agregar nueva placa...';
                    var opciones=placasActivas.concat([OPT_CREAR]);
                    return <SS value={nuevaPlaca} onChange={function(val){if(val===OPT_CREAR){setCrearPlacaOpen(true);setCrearPlacaMsg(null);}else{setNuevaPlaca(val);}}} options={opciones} placeholder="Seleccionar nueva placa..."/>;
                  })()}
                  {crearPlacaOpen&&<div style={{marginTop:8,padding:12,background:"#f8f9fa",border:"1px solid #e5e7eb",borderRadius:10}}>
                    <p style={{fontSize:11,fontWeight:600,color:"#374151",margin:"0 0 8px"}}>Agregar nueva placa al diccionario</p>
                    <div style={{display:"flex",gap:6,marginBottom:6}}>
                      <input type="text" value={crearPlacaVal} onChange={function(e){setCrearPlacaVal(e.target.value.toUpperCase())}} placeholder="Placa (Ej: ABC 123)" style={Object.assign({},bI,{flex:1,fontSize:13})}/>
                    </div>
                    <div style={{marginBottom:8}}>
                      <Si value={crearPlacaLinea} onChange={function(v){setCrearPlacaLinea(v)}} options={LINEAS_VEHICULO.map(function(l){return l.nombre;})} placeholder="Línea del vehículo"/>
                    </div>
                    {crearPlacaMsg&&<div style={{padding:"6px 10px",borderRadius:6,marginBottom:8,fontSize:11,background:crearPlacaMsg.tipo==='error'?"rgba(239,68,68,0.08)":"rgba(22,163,74,0.08)",color:crearPlacaMsg.tipo==='error'?"#dc2626":"#16a34a",border:crearPlacaMsg.tipo==='error'?"1px solid rgba(239,68,68,0.2)":"1px solid rgba(22,163,74,0.2)"}}>{crearPlacaMsg.texto}</div>}
                    <div style={{display:"flex",gap:6}}>
                      <button type="button" onClick={crearPlacaInline} style={{flex:1,padding:"8px",background:"linear-gradient(135deg,#16a34a,#15803d)",color:"#fff",border:"none",borderRadius:8,fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:ft}}>Agregar</button>
                      <button type="button" onClick={function(){setCrearPlacaOpen(false);setCrearPlacaVal('');setCrearPlacaLinea('');setCrearPlacaMsg(null);}} style={{padding:"8px 14px",background:"#ffffff",color:"#374151",border:"1px solid #d1d5db",borderRadius:8,fontSize:12,fontWeight:500,cursor:"pointer",fontFamily:ft}}>Cancelar</button>
                    </div>
                  </div>}
                </Fd>
                <Fd label="Nuevo conductor" hint={"Actual: "+v.conductor}><Ti value={nuevoConductor} onChange={function(val){setNuevoConductor(val)}} placeholder="Nombre"/></Fd>
              </R2>
              {result&&<div style={{padding:"10px 14px",borderRadius:8,marginBottom:10,background:result.ok?"rgba(22,163,74,0.08)":"rgba(239,68,68,0.08)",border:result.ok?"1px solid rgba(22,163,74,0.2)":"1px solid rgba(239,68,68,0.2)",display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:15}}>{result.ok?"✅":"❌"}</span>
                <span style={{fontSize:12,color:result.ok?"#16a34a":"#dc2626",fontWeight:500}}>{result.msg}</span>
              </div>}
              <button onClick={guardar} disabled={saving||(!nuevaPlaca&&!nuevoConductor)} style={{width:"100%",padding:"11px",color:"#fff",border:"none",borderRadius:10,fontSize:14,fontWeight:700,cursor:saving||(!nuevaPlaca&&!nuevoConductor)?"not-allowed":"pointer",fontFamily:ft,background:saving||(!nuevaPlaca&&!nuevoConductor)?"#94a3b8":"linear-gradient(135deg,#3b82f6,#2563eb)",boxShadow:"0 4px 14px rgba(37,99,235,0.2)"}}>
                {saving?"Reasignando...":"🔄 Confirmar Reasignación"}

function aplicarCatalogos(d,mod){
  // Globales únicas (se mantienen vivas como fuente actual; los componentes
  // todavía las leen). Sirven como red de seguridad durante la migración a
  // DATOS_MODULO[mod].
  if(d.tiendas&&d.tiendas.length>0) TIENDAS=d.tiendas;
  if(d.ciudades&&d.ciudades.length>0) CIUDADES=d.ciudades;
  if(d.direcciones) DIRECCIONES=d.direcciones;
  if(d.tiendasCiudad) TIENDAS_CIUDAD=d.tiendasCiudad;
  if(d.tiendasTextil) TIENDAS_TEXTIL=d.tiendasTextil;
  if(d.idsInfoDescBodega) IDS_INFO_DESC_BODEGA=d.idsInfoDescBodega;
  if(d.idsInfoAsignacion) IDS_INFO_ASIGNACION=d.idsInfoAsignacion;
  if(d.idsInfoAsignacionConfirmar) IDS_INFO_ASIGNACION_CONFIRMAR=d.idsInfoAsignacionConfirmar;
  if(d.ordenRutaMap) ORDEN_RUTA_MAP=d.ordenRutaMap;
  if(d.vehiculosDict) VEHICULOS_DICT=d.vehiculosDict;
  if(d.lineasVehiculo) LINEAS_VEHICULO=d.lineasVehiculo;

  // ═══════ Fase 2A + 1B-3-A + 1B-3-fix-aislar: poblar DATOS_MODULO[mod] ═══════
  // ANTES: aplicarCatalogos escribía en TODOS los módulos (textil + devoluciones),
  // borrando los datos del módulo opuesto cuando el response venía vacío para ese
  // módulo. Causaba parpadeo al hacer switch entre módulos.
  // AHORA: solo escribe en DATOS_MODULO[mod], el módulo del response. Los demás
  // módulos conservan sus datos del fetch anterior.
  if (typeof DATOS_MODULO !== 'undefined' && mod && DATOS_MODULO[mod]) {
    // Mapeo de campos del response según el módulo.
    // Textil usa los campos con sufijo Tx (idsPendientesTx, etc.) por compatibilidad
    // con el backend dual antiguo. Los demás módulos usan los campos sin sufijo.
    var src;
    if (mod === 'textil') {
      src = {
        pend:        d.idsPendientesTx,
        ciudad:      d.idsCiudadTx,
        placa:       d.idsPlacaTx,
        infoDesc:    d.idsInfoDescargueTx,
        infoCierre:  d.idsInfoCierreTx,
        infoRec:     d.idsInfoRecoleccionTx,
        cancelables: d.idsCancelablesTx,
        controlData: d.controlDataTx,
        todosIds:    d.todosIdsTx
      };
    } else {
      src = {
        pend:        d.idsPendientes,
        ciudad:      d.idsCiudad,
        placa:       d.idsPlaca,
        infoDesc:    d.idsInfoDescargue,
        infoCierre:  d.idsInfoCierre,
        infoRec:     d.idsInfoRecoleccion,
        cancelables: d.idsCancelables,
        controlData: d.controlData,
        todosIds:    d.todosIds
      };
    }
    // Solo asignar si el campo viene definido en el response.
    // Si viene undefined/null → conservar el valor anterior.
    Object.keys(src).forEach(function(k){
      if (src[k] !== undefined && src[k] !== null) {
        DATOS_MODULO[mod][k] = src[k];
      }
    });

    // ── 1B-3-A: catálogos por módulo (escribe SOLO en el módulo del response) ──
    // Cada fetch trae los catálogos de UN módulo (el que pidió). Los escribimos
    // en DATOS_MODULO[mod] sin tocar los demás módulos. Así, multi-módulo
    // ya no cruza catálogos al cambiar.
    if (mod && DATOS_MODULO[mod]) {
      if (d.tiendas && d.tiendas.length > 0) DATOS_MODULO[mod].tiendas = d.tiendas;
      if (d.ciudades && d.ciudades.length > 0) DATOS_MODULO[mod].ciudades = d.ciudades;
      if (d.direcciones) DATOS_MODULO[mod].direcciones = d.direcciones;
      if (d.tiendasCiudad) DATOS_MODULO[mod].tiendasCiudad = d.tiendasCiudad;
      if (d.vehiculosDict) DATOS_MODULO[mod].vehiculosDict = d.vehiculosDict;
      if (d.lineasVehiculo) DATOS_MODULO[mod].lineasVehiculo = d.lineasVehiculo;
      if (d.idsInfoDescBodega) DATOS_MODULO[mod].idsInfoDescBodega = d.idsInfoDescBodega;
      if (d.idsInfoAsignacion) DATOS_MODULO[mod].idsInfoAsignacion = d.idsInfoAsignacion;
      if (d.idsInfoAsignacionConfirmar) DATOS_MODULO[mod].idsInfoAsignacionConfirmar = d.idsInfoAsignacionConfirmar;
      if (d.ordenRutaMap) DATOS_MODULO[mod].ordenRutaMap = d.ordenRutaMap;
      // Caso especial Textil: tiendasTextil viene aparte como lista plana.
      // Si es módulo textil y vino tiendasTextil, úsalo como tiendas.
      if (mod === 'textil' && d.tiendasTextil && d.tiendasTextil.length > 0) {
        DATOS_MODULO.textil.tiendas = d.tiendasTextil;
        // Recalcular ciudades de textil desde tiendasCiudad (filtrado a las del array)
        var seenC = {}, arrC = [];
        d.tiendasTextil.forEach(function(t){
          var c = (d.tiendasCiudad || {})[t];
          if (c && !seenC[c]) { seenC[c] = true; arrC.push(c); }
        });
        if (arrC.length > 0) DATOS_MODULO.textil.ciudades = arrC;
      }
    }
  }
}

  var modulosDisponibles_=function(permisos){

      else{setLoginError(d.msg||'Error al iniciar sesión');}

  var handleConsulta=function(){
    if(!consultaId) return;
    // Fase 2B-5c: leer controlData del módulo activo (faltó en Lote 2B-5a).
    // dmActual local dentro de la función para evitar dependencia de orden de declaración.
    var dmLocal=DATOS_MODULO[modulo]||DATOS_MODULO.textil;
    var dataArr=dmLocal.controlData||[];
    var found=null;
    var idNorm=consultaId.trim();
    if(consultaBuscarPor==='pedido'){
      for(var i=0;i<dataArr.length;i++){
        if(dataArr[i].pedido&&dataArr[i].pedido===idNorm){found=dataArr[i];break;}
      }
    } else {
      for(var i=0;i<dataArr.length;i++){
        if(dataArr[i].id===idNorm){found=dataArr[i];break;}
      }
    }
    if(!found){setConsultaData({status:'not_found',id:idNorm});return;}
    // Mostrar resultado instantáneo con datos locales
    var etapas=[
      {paso:'Solicitud',fecha:found.ts_solicitud||found.fecha_solicitud,completado:!!(found.ts_solicitud||found.fecha_solicitud)},
      {paso:'Programación',fecha:found.ts_programacion||found.fecha_programada,completado:!!(found.ts_programacion||found.fecha_programada)}
    ];
    if(found.novedad&&found.novedad.detalle){
      found.novedad.detalle.split('||').forEach(function(entry){
        var e=entry.trim();if(!e)return;
        var partes=e.split('|');var fechaN=(partes[0]||'').trim();
        var tipo=e.indexOf('FALLO')>=0?'Fallo de entrega':e.indexOf('REPROGRAMADO')>=0?'Reprogramación':'';
        var det=(partes[1]||'').trim();
        if(tipo) etapas.push({paso:tipo,fecha:fechaN,completado:true,detalle:det});
      });
    }
    if(found.estado==='Cancelada'){
      if(found.ts_recoleccion||found.fecha_recoleccion) etapas.push({paso:'Recolección',fecha:found.ts_recoleccion||found.fecha_recoleccion,completado:true});
      if(found.ts_en_camino) etapas.push({paso:'En camino',fecha:found.ts_en_camino,completado:true});
      if(found.ts_en_camino_bodega) etapas.push({paso:'En camino Bodega',fecha:found.ts_en_camino_bodega,completado:true});
      if(found.ts_descargue||found.fecha_descargue) etapas.push({paso:'Descargue',fecha:found.ts_descargue||found.fecha_descargue,completado:true});
      // Etapa Cancelada enriquecida con fecha/usuario/comentario/causal (vienen del backend)
      var canEt={paso:'Cancelada',fecha:found.cancelacion_fecha||'',completado:true};
      if(found.cancelacion_usuario) canEt.detalle='Por: '+found.cancelacion_usuario+(found.cancelacion_motivo?' — '+found.cancelacion_motivo:'');
      if(found.cancelacion_causal) canEt.causal=found.cancelacion_causal;
      etapas.push(canEt);
    } else {
      etapas.push({paso:'Recolección',fecha:found.ts_recoleccion||found.fecha_recoleccion,completado:!!(found.ts_recoleccion||found.fecha_recoleccion)});
      if(found.flujo_talleres){
        etapas.push({paso:'En camino Bodega',fecha:found.ts_en_camino_bodega||'',completado:!!(found.ts_en_camino_bodega)});
        etapas.push({paso:'Desc. Bodega',fecha:found.ts_desc_bodega||'',completado:!!(found.ts_desc_bodega)});
        etapas.push({paso:'Asignación',fecha:found.ts_asignacion||'',completado:!!(found.ts_asignacion)});
        etapas.push({paso:'En camino CEDI',fecha:found.ts_en_camino_cedi||'',completado:!!(found.ts_en_camino_cedi)});
      } else {
        etapas.push({paso:'En camino',fecha:found.ts_en_camino||'',completado:!!(found.ts_en_camino)});
      }
      etapas.push({paso:'Descargue',fecha:found.ts_descargue||found.fecha_descargue,completado:!!(found.ts_descargue||found.fecha_descargue)});
      etapas.push({paso:'Cierre',fecha:found.ts_cierre||found.fecha_cierre,completado:!!(found.ts_cierre||found.fecha_cierre)});
    }
    setConsultaData({status:'ok',id:found.id,estado:found.estado,cliente:found.cliente,tienda:found.tienda,direccion:found.direccion,sla:found.sla,etapas:etapas,novedad:found.novedad||null,ciudad:found.ciudad||'',productos:found.productos||'',conductor:found.conductor||'',cantidades:found.cantidades||'',pedido_devolucion:found.pedido||'',flujo_talleres:found.flujo_talleres||false,asig_placa:found.asignacion_data?found.asignacion_data.placa:'',asig_conductor:found.asignacion_data?found.asignacion_data.conductor:'',asig_vehiculo:found.asignacion_data?found.asignacion_data.vehiculo:'',asig_fecha:found.asignacion_data?found.asignacion_data.fecha:'',fotos_por_etapa:found.fotos_por_etapa||null,etapasListas:true});
   // Fetch servidor como backup silencioso (novedades detalladas + fotos)
    var consultaUrl=consultaBuscarPor==='pedido'?CATALOGO_URL+'?action=consulta_pedido&pedido='+encodeURIComponent(idNorm):CATALOGO_URL+'?action=consulta&id='+encodeURIComponent(idNorm);
    fetch(consultaUrl).then(function(r){return r.json()}).then(function(d){
      if(d.status==='ok'){
        setConsultaData(function(prev){
          if(!prev||prev.id!==d.id) return prev;
          // Preservar etapas del cliente si tiene más info (incluye estados "En camino" que backend aún no devuelve)
          var etapasFinal=prev.etapas;
          if(d.etapas&&Array.isArray(d.etapas)&&d.etapas.length>prev.etapas.length) etapasFinal=d.etapas;
          // Enriquecer etapa Cancelada con datos del backend (fecha/usuario/motivo/causal)
          if(d.cancelacion_fecha||d.cancelacion_usuario||d.cancelacion_motivo||d.cancelacion_causal){
            etapasFinal=etapasFinal.map(function(et){
              if(et.paso==='Cancelada'){
                var nuevo=Object.assign({},et);
                if(d.cancelacion_fecha&&!nuevo.fecha) nuevo.fecha=d.cancelacion_fecha;
                if(d.cancelacion_usuario&&!nuevo.detalle) nuevo.detalle='Por: '+d.cancelacion_usuario+(d.cancelacion_motivo?' — '+d.cancelacion_motivo:'');
                if(d.cancelacion_causal&&!nuevo.causal) nuevo.causal=d.cancelacion_causal;
                return nuevo;
              }
              return et;
            });
          }
          return Object.assign({},prev,d,{etapas:etapasFinal,pedido_devolucion:d.pedido_devolucion||prev.pedido_devolucion,fotos_por_etapa:d.fotos_por_etapa||null});
        });
      }
    }).catch(function(){});
  };

  var handleNovedad=async function(){
    if(!novId||!novAccion){setNovResult({ok:false,msg:'Selecciona ID y acción'});return;}

    try{
      if(!novCausal){setNovResult({ok:false,msg:'Selecciona una causal'});setNovLoading(false);return;}

      if(novAccion==='fallo'){
        if(!novFotos||novFotos.length===0){setNovResult({ok:false,msg:'Adjunta al menos una foto de la fachada'});setNovLoading(false);return;}
        // Convertir fotos a base64
        var fotosArr=[];
        var filesN=Array.from(novFotos).slice(0,3);
        for(var i=0;i<filesN.length;i++){
          var fileN=filesN[i];
          if(fileN.size>10*1024*1024){setNovResult({ok:false,msg:'El archivo "'+fileN.name+'" supera 10 MB'});setNovLoading(false);return;}
          var b64N=await new Promise(function(resolve){var reader=new FileReader();reader.onload=function(){resolve(reader.result.split(',')[1])};reader.readAsDataURL(fileN);});
          fotosArr.push({nombre:fileN.name,tipo:fileN.type,data:b64N});

  useEffect(function(){

    // Antes esto disparaba fetch con módulo='devoluciones' (default del useState
    // inicial cuando user=null), cargando catálogos de DV en globales y produciendo
    // race condition con el fetch del login → "parpadeo" de datos DV antes de Textil.
    if(!user) return;
    // Cache local → instantáneo (3.3.2b-v3/1B-2-fix2: cache separado por módulo)
    var tieneCacheLocal=false;
    try{
      var cached=localStorage.getItem('condor_catalogos_'+modulo);
      if(cached){
        var d=JSON.parse(cached);
        aplicarCatalogos(d,modulo);
        setCargado(true);
        tieneCacheLocal=true;
      }
    }catch(e){}
    // Fetch en background (no bloquea UI)
    var fetchTimer=setTimeout(function(){
      fetch(CATALOGO_URL+'?modulo='+modulo).then(function(r){return r.json()}).then(function(d){
        try{localStorage.setItem('condor_catalogos_'+modulo,JSON.stringify(d));}catch(e){}
        aplicarCatalogos(d,modulo);
        if(!tieneCacheLocal) setCargado(true);
      }).catch(function(e){console.log("Error:",e);if(!tieneCacheLocal) setCargado(true);});
    },tieneCacheLocal?3000:0);
