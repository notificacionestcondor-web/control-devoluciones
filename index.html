                return(<div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  {puedeAccion&&<button type="button" onClick={function(){setNovAccion('fallo');setNovResult(null);}} style={{flex:1,padding:"12px",borderRadius:10,fontSize:13,fontFamily:ft,fontWeight:novAccion==='fallo'?700:400,border:novAccion==='fallo'?"1.5px solid #dc2626":"1px solid #d1d5db",background:novAccion==='fallo'?"rgba(220,38,38,0.08)":"#ffffff",color:novAccion==='fallo'?"#dc2626":"#374151",cursor:"pointer"}}>🚫 Fallo de entrega</button>}
                  {puedeAccion&&<button type="button" onClick={function(){setNovAccion('reprogramar');setNovResult(null);}} style={{flex:1,padding:"12px",borderRadius:10,fontSize:13,fontFamily:ft,fontWeight:novAccion==='reprogramar'?700:400,border:novAccion==='reprogramar'?"1.5px solid #2563eb":"1px solid #d1d5db",background:novAccion==='reprogramar'?"rgba(37,99,235,0.08)":"#ffffff",color:novAccion==='reprogramar'?"#1e40af":"#374151",cursor:"pointer"}}>🔄 Reprogramar</button>}
                  {puedeAccion&&<button type="button" onClick={function(){setNovAccion('cancelar');setNovResult(null);}} style={{flex:1,padding:"12px",borderRadius:10,fontSize:13,fontFamily:ft,fontWeight:novAccion==='cancelar'?700:400,border:novAccion==='cancelar'?"1.5px solid #991b1b":"1px solid #d1d5db",background:novAccion==='cancelar'?"rgba(153,27,27,0.08)":"#ffffff",color:novAccion==='cancelar'?"#991b1b":"#374151",cursor:"pointer"}}>❌ Cancelar solicitud</button>}
                  {!puedeAccion&&<div style={{flex:1,padding:"12px",borderRadius:10,fontSize:12,background:"#f8f9fa",border:"1px solid #e5e7eb",color:"#6b7280",textAlign:"center"}}>🔒 No disponible — la solicitud ya fue {novInfo?novInfo.estado.toLowerCase():'procesada'}</div>}
                </div>);
              })()}
            </Fd>

            {novAccion&&(function(){
              var causalesFiltradas=CAUSALES_NOV.filter(function(x){return x.acc.indexOf(novAccion)>=0;});
              var causalesOpts=causalesFiltradas.map(function(x){return x.c+' · '+x.l;});
              var causalSelLabel=novCausal?(function(){var f=CAUSALES_NOV.find(function(x){return x.c===novCausal;});return f?f.c+' · '+f.l:'';})():'';
              return(<Fd label="Causal" req hint="Selecciona el código correspondiente">
                <SS value={causalSelLabel} onChange={function(v){var cod=(v||'').split(' · ')[0];setNovCausal(cod);}} options={causalesOpts} placeholder="Seleccionar causal..."/>
              </Fd>);
            })()}

            {novAccion==='fallo'&&<div>
              <Fd label="Comentario" hint="Opcional — detalle adicional (máx 200 caracteres)"><Ta value={novMotivo} onChange={function(v){setNovMotivo(v.slice(0,200))}} placeholder="Comentario adicional..."/></Fd>
              <Fd label="Foto de la fachada" req hint="Obligatoria — evidencia de la visita (máx 3 archivos, 10 MB c/u)">
                <input type="file" multiple accept="image/*" onChange={function(e){setNovFotos(e.target.files);}} style={Object.assign({},bI,{padding:"8px 12px",cursor:"pointer"})}/>
                {novFotos&&novFotos.length>0&&<p style={{fontSize:10,color:"#16a34a",marginTop:4,fontFamily:mn}}>✓ {novFotos.length} archivo(s) listo(s)</p>}
              </Fd>
            </div>}

            {novAccion==='reprogramar'&&<div>
              <SB title="📝 Datos de reprogramación">
                <R2>
                  <Fd label="Nueva ciudad" hint="Dejar vacío si no cambia"><SS value={novCiudad} onChange={function(v){setNovCiudad(v)}} options={CIUDADES} placeholder="Seleccionar..."/></Fd>
                  <Fd label="Nueva dirección" hint="Dejar vacío si no cambia"><Ti value={novDir} onChange={function(v){setNovDir(v)}} placeholder="Nueva dirección..."/></Fd>
                </R2>
                <Fd label="Nuevas cantidades" hint="Solo llena los productos que cambian">
                  <div className="qty-grid" style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:8}}>
                    {(modulo==='textil'?["Rollos"]:["Contenedores vacios","Contenedores con Ganchos","Confección","Telas","Mobiliario"]).map(function(p){var mp={"Contenedores vacios":"cv","Contenedores con Ganchos":"cg","Confección":"cf","Telas":"tl","Mobiliario":"mb","Rollos":"rollos"};var k=mp[p];return <div key={p}><label style={{fontSize:10,color:"#94a3b8",display:"block",marginBottom:2}}>{p}</label><Ti type="number" value={novUnidades[k]||''} onChange={function(v){var nu=Object.assign({},novUnidades);nu[k]=v;setNovUnidades(nu);}} placeholder="0"/></div>;})}
                  </div>
                </Fd>
                <Fd label="Comentario" hint="Opcional (máx 200 caracteres)"><Ta value={novObs} onChange={function(v){setNovObs(v.slice(0,200))}} placeholder="Comentario adicional..."/></Fd>
              </SB>
            </div>}

            {novAccion==='cancelar'&&<div>
              <div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:12,padding:16,marginBottom:14}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
                  <span style={{fontSize:18}}>⚠️</span>
                  <div>
                    <p style={{margin:0,fontSize:14,fontWeight:700,color:"#991b1b"}}>Confirmar cancelación</p>
                    <p style={{margin:0,fontSize:11,color:"#6b7280"}}>Esta acción no se puede deshacer. La solicitud no avanzará en el proceso.</p>
                  </div>
                </div>
                <Fd label="Comentario" hint="Opcional — detalle adicional (máx 200 caracteres)"><Ta value={novMotivo} onChange={function(v){setNovMotivo(v.slice(0,200))}} placeholder="Comentario adicional..."/></Fd>
              </div>
            </div>}

            {novResult&&<div style={{padding:"12px 16px",borderRadius:10,marginBottom:14,background:novResult.ok?"rgba(22,163,74,0.1)":"rgba(239,68,68,0.1)",border:novResult.ok?"1px solid rgba(22,163,74,0.2)":"1px solid rgba(239,68,68,0.2)",display:"flex",alignItems:"center",gap:10}}>
              <span style={{fontSize:17}}>{novResult.ok?"✅":"❌"}</span>
              <span style={{fontSize:13,color:novResult.ok?"#16a34a":"#dc2626",fontWeight:500}}>{novResult.msg}</span>
            </div>}

            {novAccion&&<button onClick={handleNovedad} disabled={novLoading} style={{width:"100%",padding:"13px",color:"#fff",border:"none",borderRadius:10,fontSize:15,fontWeight:700,cursor:novLoading?"not-allowed":"pointer",fontFamily:ft,background:novLoading?"#475569":novAccion==='cancelar'?"linear-gradient(135deg,#991b1b,#7f1d1d)":novAccion==='fallo'?"linear-gradient(135deg,#ef4444,#dc2626)":"linear-gradient(135deg,#3b82f6,#2563eb)",boxShadow:"0 4px 14px rgba(0,0,0,0.2)"}}>
              {novLoading?"Procesando...":(novAccion==='fallo'?"🚫 Registrar Fallo de servicio":novAccion==='cancelar'?"❌ Confirmar Cancelación":"🔄 Registrar Reprogramación")}
            </button>}
          </div>
        </div>
      </div>}
    </div>
  );
}
ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
